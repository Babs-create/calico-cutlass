/* =========================================================
   CALICO CUTLASS  -  an original pirate-cat platformer
   Single file. No external assets. All art drawn in code.
   ========================================================= */
const W=800,H=450,T=32,RS=2,GR=1800;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let K=1;
function resize(){const s=Math.min(innerWidth/W,innerHeight/H);const dpr=Math.min(window.devicePixelRatio||1,2);K=s*dpr;cv.width=Math.round(W*K);cv.height=Math.round(H*K);cv.style.width=Math.round(W*s)+'px';cv.style.height=Math.round(H*s)+'px';}
addEventListener('resize',resize);resize();

/* ---------- helpers ---------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function mk(w,h,fn){const c=document.createElement('canvas');c.width=w*RS;c.height=h*RS;const g=c.getContext('2d');g.scale(RS,RS);fn(g,w,h);return c}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function tri(g,a,b,c,d,e,f){g.beginPath();g.moveTo(a,b);g.lineTo(c,d);g.lineTo(e,f);g.closePath();g.fill()}
function ell(g,x,y,rx,ry,rot){g.beginPath();g.ellipse(x,y,rx,ry,rot||0,0,Math.PI*2);g.fill()}
function ln(g,a,b,c,d){g.beginPath();g.moveTo(a,b);g.lineTo(c,d);g.stroke()}
function shade(hex,amt){let c=parseInt(hex.slice(1),16),r=c>>16,g=c>>8&255,b=c&255;if(amt<0){r*=1+amt;g*=1+amt;b*=1+amt}else{r+=(255-r)*amt;g+=(255-g)*amt;b+=(255-b)*amt}return`rgb(${r|0},${g|0},${b|0})`}
const HAS_FILTER='filter' in ctx;

/* ---------- input ---------- */
const keys={},pressed={};
const KEYMAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',Space:'jump',KeyZ:'attack',KeyJ:'attack',KeyX:'shoot',KeyK:'shoot',KeyC:'grab',KeyL:'grab',KeyE:'grab',Enter:'start',NumpadEnter:'start',KeyP:'pause',Escape:'pause',KeyM:'mute',KeyN:'cont'};
addEventListener('keydown',e=>{const k=KEYMAP[e.code];if(k){if(!keys[k])pressed[k]=true;keys[k]=true;e.preventDefault();}audioInit();});
addEventListener('keyup',e=>{const k=KEYMAP[e.code];if(k){keys[k]=false;e.preventDefault();}});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;if(state==='play')state='paused'});
function hit(k){if(pressed[k]){pressed[k]=false;return true}return false}
cv.addEventListener('pointerdown',()=>{audioInit();pressed.start=true});
(function touchSetup(){
  const coarse=matchMedia('(pointer:coarse)').matches||('ontouchstart' in window);
  if(!coarse)return;
  const tc=document.getElementById('touch');tc.style.display='block';
  tc.querySelectorAll('.tb').forEach(b=>{
    const k=b.dataset.k;
    const on=e=>{e.preventDefault();audioInit();if(!keys[k])pressed[k]=true;keys[k]=true;b.classList.add('on');if(state!=='play'&&k!=='pause')pressed.start=true;};
    const off=e=>{e.preventDefault();keys[k]=false;b.classList.remove('on')};
    b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off);
  });
})();

/* ---------- audio ---------- */
let AC=null,master=null,musicGain=null,muted=false,noiseBuf=null;
function audioInit(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=0.55;master.connect(AC.destination);musicGain=AC.createGain();musicGain.gain.value=0.32;musicGain.connect(master);if(pendingSong!==null)playSong(pendingSong);}catch(e){AC=null}}
function tone(f,d,type,v,slide,delay){if(!AC||muted)return;const t=AC.currentTime+(delay||0);const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(v||0.1,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+0.03)}
function noise(d,v,freq,delay){if(!AC||muted)return;if(!noiseBuf){noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const a=noiseBuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}const t=AC.currentTime+(delay||0);const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=freq||1200;const g=AC.createGain();g.gain.setValueAtTime(v||0.2,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+d+0.03)}

const music={on:false,step:0,next:0,song:null,timer:null};let pendingSong=null;
function note(m,d,type,v,t){const f=440*Math.pow(2,(m-69)/12);const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+0.01);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(g);g.connect(musicGain);o.start(t);o.stop(t+d+0.05)}
function playSong(i){pendingSong=i;if(!AC)return;music.song=SONGS[i];music.step=0;music.next=AC.currentTime+0.1;music.on=true;if(!music.timer)music.timer=setInterval(schedule,25)}
function stopSong(){music.on=false;pendingSong=null}
function schedule(){if(!AC||!music.on||!music.song)return;const s=music.song,st=60/s.bpm/2;while(music.next<AC.currentTime+0.15){const i=music.step%s.lead.length;if(!muted){const n=s.lead[i];if(n)note(n,st*0.85,s.wave,0.045,music.next);if(i%2===0){const b=s.bass[(i/2)%s.bass.length];if(b)note(b,st*1.7,'triangle',0.11,music.next)}}music.step++;music.next+=st}}

function plank(g,x,y,w,h,c){g.fillStyle=c;g.fillRect(x,y,w,h);g.fillStyle=shade(c,.28);g.fillRect(x,y,w,2);g.fillStyle=shade(c,-.4);g.fillRect(x,y+h-2,w,2);g.fillStyle='rgba(0,0,0,.3)';g.fillRect(x+w-1,y,1,h);g.fillStyle='#2a1a0a';g.fillRect(x+3,y+h/2-1,2,2);g.fillRect(x+w-6,y+h/2-1,2,2);g.strokeStyle='rgba(60,30,10,.35)';g.lineWidth=1;ln(g,x+7,y+h*.4,x+w-9,y+h*.4)}

/* =========================================================
   WORLD STATE
   ========================================================= */
let state='title',titleT=0,introT=0,doneT=0;
let lvl=null,lvlIdx=0,P=null,camX=0,camY=0,shake=0,gt=0;
let enemies=[],pBul=[],eBul=[],pickups=[],barrels=[],crates=[],flags=[],plats=[],parts=[],torches=[];
let boss=null,arena={active:false,done:false,x:0},checkpoint={x:0,y:0};
let score=0,lives=9,levelStartScore=0,nextLife=50000,lvlStats={treasure:0,kills:0,time:0},charts=0;
let banner=null;

function newPlayer(x,y){return{x,y,w:22,h:42,vx:0,vy:0,face:1,onGround:false,hp:100,ammo:10,magic:{type:null,t:0},catnip:0,atk:0,atkDur:.28,atkKind:'slash',combo:0,comboT:0,swing:0,shoot:0,shootCd:0,invuln:0,hurtT:0,coyote:0,jumpBuf:0,climb:false,carry:null,drop:0,ride:null,dead:false,deadT:0,t:0,blinkT:3}}

function buildLevel(idx){
  const def=LEVELS[idx];
  const rows=Array.from({length:15},()=>'');
  let arenaCol=0;
  def.chunks.forEach(n=>{const ch=CH[n];const w=Math.max(...ch.map(r=>r.length));if(n==='boss')arenaCol=rows[0].length;for(let y=0;y<15;y++)rows[y]+=(ch[y]||'').padEnd(w,'.')});
  const w=rows[0].length,h=15;
  lvl={idx,def,w,h,t:[],crumble:new Map(),tex:getTex(def.theme),bg:getBG(def.theme),info:THEME_INFO[def.theme]};
  enemies=[];pBul=[];eBul=[];pickups=[];barrels=[];crates=[];flags=[];plats=[];parts=[];torches=[];boss=null;
  arena={active:false,done:false,x:arenaCol*T,bossSpawn:null};
  let start={x:64,y:384};
  for(let y=0;y<h;y++){lvl.t.push(new Uint8Array(w));for(let x=0;x<w;x++){
    const c=rows[y][x];const px=x*T,py=y*T;
    switch(c){
      case '#':lvl.t[y][x]=1;break;
      case '=':lvl.t[y][x]=2;break;
      case 'H':lvl.t[y][x]=3;break;
      case '^':lvl.t[y][x]=4;break;
      case 'C':lvl.t[y][x]=5;lvl.crumble.set(y*w+x,{state:'solid',t:0});break;
      case '@':start={x:px+5,y:py+T};break;
      case 'c':addPickup('coin',px+6,py+6);break;
      case 'g':addPickup('gem',px+6,py+6);break;
      case 'a':addPickup('ammo',px+6,py+10);break;
      case 'h':addPickup('health',px+6,py+10);break;
      case 'n':addPickup('catnip',px+6,py+8);break;
      case 'l':addPickup('life',px+6,py+6);break;
      case 'Z':{let el=def.magic;if(el==='random')el=['fire','ice','lightning'][(x+y)%3];addPickup('magic',px+6,py+6).el=el;break}
      case 'b':barrels.push({x:px+4,y:py+T-28,w:24,h:28,vx:0,vy:0,sx:px+4,sy:py+T-28,arena:arenaCol>0&&x>=arenaCol,carried:false,thrown:false,fuse:-1,dead:false,respawn:0});break;
      case 'x':crates.push({x:px+1,y:py+2,w:30,h:30,dead:false});break;
      case 'f':flags.push({x:px,y:py+T,w:32,h:60,up:false,anim:0});break;
      case 't':torches.push({x:px+16,y:py+T});break;
      case 'M':plats.push({x:px,y:py,w:T*3,h:12,x0:px,x1:px+T*7,dir:1,spd:72,dx:0});break;
      case 'e':spawnEnemy('grunt',x,y);break;
      case 'r':spawnEnemy('rat',x,y);break;
      case 's':spawnEnemy('musk',x,y);break;
      case 'v':spawnEnemy('fly',x,y);break;
      case 'B':arena.bossSpawn={x,y};break;
    }
  }}
  checkpoint={x:start.x,y:start.y};
  P=newPlayer(start.x,start.y-42);
  camX=0;camY=lvl.h*T-H;
}
function addPickup(type,x,y,phys){
  const p={type,x,y,w:20,h:20,t:0,phys:!!phys,vx:0,vy:0,life:phys?12:-1};
  if(type==='gem'){const g=[['#e23b4a',500],['#2fbf5a',750],['#3a7bea',1000],['#b54ae0',1500]][Math.floor(Math.random()*4)];p.col=g[0];p.value=g[1]}
  pickups.push(p);return p;
}
function spawnEnemy(type,tx,ty,extra){
  const m=1+lvl.idx*.1,md=1+lvl.idx*.08;
  const base={grunt:{w:26,h:46,hp:3,spd:55,dmg:12,score:300},rat:{w:24,h:36,hp:2,spd:100,dmg:8,score:200},musk:{w:26,h:46,hp:3,spd:0,dmg:10,score:400},fly:{w:28,h:20,hp:1,spd:90,dmg:8,score:250}}[type];
  const e=Object.assign({type,vx:0,vy:0,face:-1,t:Math.random()*9,state:'patrol',st:0,stun:0,frozen:0,flash:0,swing:-1,cd:1+Math.random(),aim:0,recoil:0,atk:0,dead:false,onGround:false},base);
  e.hp=Math.ceil(base.hp*m);e.dmg=Math.round(base.dmg*md);
  e.x=tx*T+(T-e.w)/2;e.y=(ty+1)*T-e.h;e.home=e.x;e.hy=e.y;
  if(extra)Object.assign(e,extra);
  enemies.push(e);return e;
}

/* ---------- tiles & physics ---------- */
function tileAt(tx,ty){if(ty<0||ty>=lvl.h)return 0;if(tx<0||tx>=lvl.w)return 1;return lvl.t[ty][tx]}
function isOneway(tx,ty){const c=tileAt(tx,ty);if(c===2)return true;if(c===5){const k=lvl.crumble.get(ty*lvl.w+tx);return !k||k.state!=='gone'}if(c===3)return tileAt(tx,ty-1)!==3;return false}
function moveBody(b,dt,noOne){
  b.onGround=false;b.hitWall=0;
  b.x+=b.vx*dt;
  let top=Math.floor(b.y/T),bot=Math.floor((b.y+b.h-.01)/T);
  if(b.vx>0){const tx=Math.floor((b.x+b.w)/T);for(let ty=top;ty<=bot;ty++)if(tileAt(tx,ty)===1){b.x=tx*T-b.w-.01;b.hitWall=1;break}}
  else if(b.vx<0){const tx=Math.floor(b.x/T);for(let ty=top;ty<=bot;ty++)if(tileAt(tx,ty)===1){b.x=(tx+1)*T+.01;b.hitWall=-1;break}}
  if(b.hitWall)b.vx=0;
  const prevBottom=b.y+b.h;
  b.y+=b.vy*dt;
  const l=Math.floor(b.x/T),r=Math.floor((b.x+b.w-.01)/T);
  if(b.vy>0){const ty=Math.floor((b.y+b.h)/T);for(let tx=l;tx<=r;tx++){const c=tileAt(tx,ty);if(c===1||(!noOne&&isOneway(tx,ty)&&prevBottom<=ty*T+1.5)){b.y=ty*T-b.h;b.vy=0;b.onGround=true;b.gty=ty;b.groundTile=c;break}}}
  else if(b.vy<0){const ty=Math.floor(b.y/T);for(let tx=l;tx<=r;tx++)if(tileAt(tx,ty)===1){b.y=(ty+1)*T;b.vy=0;break}}
}
function solidPt(x,y){return tileAt(Math.floor(x/T),Math.floor(y/T))===1}

/* ---------- effects ---------- */
function part(o){parts.push(Object.assign({vx:0,vy:0,g:0,life:.6,max:.6,size:3,col:'#fff',type:'p',rot:0,vr:0},o));}
function burst(x,y,n,col,spd,opts){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=rand(spd*.3,spd);part(Object.assign({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.3,.7),col,size:rand(1.5,3.5),g:400},opts||{}))}}
function stars(x,y){for(let i=0;i<6;i++){const a=i/6*Math.PI*2;part({x,y,vx:Math.cos(a)*140,vy:Math.sin(a)*140,life:.4,max:.4,col:'#ffe58a',size:3,type:'star'})}}
function popup(x,y,txt,col){parts.push({type:'text',x,y,vx:0,vy:-50,g:0,life:1,max:1,txt,col:col||'#ffe58a'})}
function smoke(x,y,n,col){for(let i=0;i<n;i++)part({x:x+rand(-8,8),y:y+rand(-8,8),vx:rand(-40,40),vy:rand(-60,-10),life:rand(.5,1),max:1,col:col||'rgba(80,70,60,.5)',size:rand(6,12),type:'smoke'})}
function addScore(n,x,y){score+=n;lvlStats.treasure+=n;if(x!==undefined)popup(x,y,'+'+n);if(score>=nextLife){nextLife+=50000;if(lives<9){lives++;popup(P.x,P.y-20,'EXTRA LIFE','#7fff8a');SFX.power()}}}

/* ---------- combat ---------- */
function hurtPlayer(dmg,dir){
  if(!P||P.dead||P.invuln>0||state!=='play')return;
  P.hp-=dmg;P.invuln=1.3;P.hurtT=.3;P.vx=(dir||-P.face)*220;P.vy=-280;P.climb=false;P.atk=0;
  if(P.carry){dropBarrel()}
  SFX.hurt();shake=Math.max(shake,6);burst(P.x+P.w/2,P.y+P.h/2,8,'#ffb0a0',200);
  if(P.hp<=0)killPlayer(false);
}
function killPlayer(pit){P.hp=0;P.dead=true;P.deadT=pit?1:1.8;P.vy=pit?0:-520;P.vx=0;P.carry=null;SFX.die()}
function hurtEnemy(e,dmg,dir,kb,opt){
  if(e.dead)return;
  e.hp-=dmg;e.flash=.12;e.stun=.28;e.state=e.type==='fly'?'return':'chase';e.atk=0;e.aim=0;
  e.vx=dir*(kb||170);if(e.type!=='fly')e.vy=-160;
  if(opt&&opt.freeze){e.frozen=2.8;e.stun=0}
  SFX.hit();burst(e.x+e.w/2,e.y+e.h/2,6,'#fff',180,{g:0});
  if(e.hp<=0)killEnemy(e,dir);
}
function killEnemy(e,dir){
  e.dead=true;lvlStats.kills++;addScore(e.score,e.x+e.w/2,e.y);SFX.edie();stars(e.x+e.w/2,e.y+e.h/2);
  parts.push({type:'corpse',ek:e.type,x:e.x+e.w/2,y:e.y+e.h,vx:dir*160,vy:-420,g:1400,life:2,max:2,rot:0,vr:dir*9,face:e.face,summoned:e.summoned});
  const r=Math.random();
  if(r<.3)drop('coin',e);else if(r<.42)drop('ammo',e);else if(r<.5)drop('health',e);else if(r<.55)drop('gem',e);
}
function drop(type,o){const p=addPickup(type,o.x+o.w/2-10,o.y+o.h/2-10,true);p.vy=-300;p.vx=rand(-80,80);return p}
function breakCrate(c){
  if(c.dead)return;c.dead=true;SFX.crate();
  for(let i=0;i<8;i++)part({type:'debris',x:c.x+15,y:c.y+15,vx:rand(-200,200),vy:rand(-380,-120),g:1200,life:1,max:1,col:'#b07a3e',size:rand(4,8),rot:Math.random()*6,vr:rand(-10,10)});
  const r=Math.random();const n=2+Math.floor(Math.random()*3);
  for(let i=0;i<n;i++)drop('coin',c);
  if(r<.35)drop('gem',c);else if(r<.55)drop('ammo',c);else if(r<.65)drop('health',c);
}
function hurtBoss(dmg,src){
  const b=boss;if(!b||b.dead||b.state==='intro'||b.ifr>0)return false;
  b.hp-=dmg;b.ifr=src==='melee'?.05:.12;b.flash=.12;SFX.bossHit();burst(b.x+b.w/2,b.y+b.h/2,8,'#fff',220,{g:0});
  if(b.hp<=0){b.hp=0;b.dead=true;b.st=2.2;b.vx=0;addScore(5000,b.x+b.w/2,b.y);shake=12;SFX.boom();enemies.forEach(e=>{if(e.summoned&&!e.dead)killEnemy(e,1)});eBul=[]}
  return true;
}
function explode(x,y,r,src){
  SFX.boom();shake=Math.max(shake,10);
  for(let i=0;i<22;i++){const a=Math.random()*Math.PI*2,s=rand(40,300);part({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.3,.7),max:.7,col:['#ffd25a','#ff7a1a','#ff4a1a','#fff3b0'][i%4],size:rand(3,7),g:200})}
  smoke(x,y,10,'rgba(60,55,50,.55)');
  parts.push({type:'ring',x,y,life:.3,max:.3,r});
  if(src!=='enemy'){
    enemies.forEach(e=>{if(!e.dead&&Math.hypot(e.x+e.w/2-x,e.y+e.h/2-y)<r+e.w/2)hurtEnemy(e,5,Math.sign(e.x+e.w/2-x)||1,260)});
    crates.forEach(c=>{if(!c.dead&&Math.hypot(c.x+15-x,c.y+15-y)<r+15)breakCrate(c)});
    if(boss&&!boss.dead&&Math.hypot(boss.x+boss.w/2-x,boss.y+boss.h/2-y)<r+boss.w/2)hurtBoss(4,'boom');
  }
  barrels.forEach(b=>{if(!b.dead&&!b.carried&&b.fuse<0&&Math.hypot(b.x+12-x,b.y+14-y)<r)b.fuse=.18});
  if(src!=='thrown'&&P&&!P.dead&&Math.hypot(P.x+P.w/2-x,P.y+P.h/2-y)<r*.75)hurtPlayer(src==='enemy'?14:12,Math.sign(P.x+P.w/2-x)||1);
}

/* ---------- player ---------- */
function updatePlayer(dt){

  if(p.magic.t>0){p.magic.t-=dt;if(p.magic.t<=0)p.magic.type=null}

  let ax=0;if(p.hurtT<=0){if(keys.left)ax-=1;if(keys.right)ax+=1}

  const ladderBelow=tileAt(ltx,Math.floor((p.y+p.h+3)/T))===3;
  if(!p.climb&&!p.carry&&p.hurtT<=0){
    if(keys.up&&ladderHere){p.climb=true;pressed.up=false}
    else if(keys.down&&p.onGround&&ladderBelow){p.climb=true;p.y+=4}
  }
  for(const pl of plats)pl.prevY=pl.y;
  if(p.ride&&p.onGround)p.x+=p.ride.dx;
  p.ride=null;
  const prevBottom=p.y+p.h;
  if(p.climb){
    p.x=ltx*T+(T-p.w)/2;p.vx=0;p.atk=0;
    p.vy=((keys.up?-1:0)+(keys.down?1:0))*135;
    if(hit('jump')){p.climb=false;p.vy=-jv*.7;p.vx=ax*spd;SFX.jump()}
    else{
      moveBody(p,dt,keys.down);
      const still=tileAt(ltx,Math.floor((p.y+p.h-1)/T))===3||tileAt(ltx,Math.floor((p.y+p.h*.5)/T))===3;
      if(!still)p.climb=false;

    }
  }else{
    const acc=p.onGround?2400:1500;const target=ax*spd;

    if(p.onGround)p.coyote=.1;else p.coyote-=dt;
    if(hit('jump')||(!ladderHere&&hit('up')))p.jumpBuf=.13;else p.jumpBuf-=dt;
    if(p.jumpBuf>0&&p.coyote>0&&p.hurtT<=0){
      const gtile=p.groundTile;
      if(keys.down&&p.onGround&&(gtile===2||gtile===5)){p.drop=.25;p.y+=3}
      else{p.vy=-jv;SFX.jump();for(let i=0;i<4;i++)part({x:cx,y:p.y+p.h,vx:rand(-60,60),vy:rand(-40,0),life:.3,max:.3,col:'rgba(220,210,190,.6)',size:4,type:'smoke'})}
      p.jumpBuf=0;p.coyote=0;
    }
    if(p.vy<0&&!(keys.jump||keys.up))p.vy+=GR*dt*1.3;
    p.vy=Math.min(p.vy+GR*dt,900);
    moveBody(p,dt,p.drop>0);
    if(p.vy>=0){for(const pl of plats){if(p.x+p.w>pl.x+2&&p.x<pl.x+pl.w-2&&prevBottom<=pl.prevY+3&&p.y+p.h>=pl.y){p.y=pl.y-p.h;p.vy=0;p.onGround=true;p.ride=pl;p.groundTile=9}}}
  }
  if(arena.active&&p.x<arena.x+2){p.x=arena.x+2;if(p.vx<0)p.vx=0}
  // crumble

  // spikes
  {const l=Math.floor(p.x/T),r=Math.floor((p.x+p.w-.01)/T),t0=Math.floor(p.y/T),t1=Math.floor((p.y+p.h-.01)/T);
   for(let ty=t0;ty<=t1;ty++)for(let tx=l;tx<=r;tx++)if(tileAt(tx,ty)===4&&p.y+p.h>ty*T+16){hurtPlayer(20,-p.face);if(!p.dead)p.vy=-480}}
  // attack
  if(hit('attack')&&!p.climb&&p.hurtT<=0){
    if(p.carry)throwBarrel();
    else if(p.atk<=0){
      p.combo=p.comboT>0?(p.combo+1)%3:0;p.atkKind=p.combo===2?'kick':'slash';
      p.atkDur=cat?.17:.27;p.atk=p.atkDur;p.swing++;p.comboT=.55;
      if(p.atkKind==='kick')SFX.kick();else SFX.slash();

    }
  }

    }
  }

    if(p.ammo>0){p.ammo--;p.shoot=.22;p.shootCd=cat?.18:.32;SFX.shoot();pBul.push({kind:'bullet',x:cx+p.face*24,y:p.y+16,vx:p.face*640,vy:0,r:3.5,dmg:2,life:1.2,hits:new Set(),t:0});smoke(cx+p.face*28,p.y+16,3,'rgba(220,220,220,.5)')}
    else{SFX.click();popup(cx,p.y-6,'No ammo','#ccc');p.shootCd=.3}
  }

    if(p.carry)throwBarrel();
    else{const zone={x:p.x-16,y:p.y,w:p.w+32,h:p.h+4};const b=barrels.find(b=>!b.dead&&!b.carried&&b.fuse<0&&ov(zone,b));if(b){p.carry=b;b.carried=true;b.thrown=false;b.vx=b.vy=0;SFX.click()}}
  }

  if(p.y>lvl.h*T+40&&!p.dead)killPlayer(true);
}

function updateEnemy(e,dt){

  if(e.frozen>0){e.frozen-=dt;e.vx=0;if(e.type!=='fly'){e.vy=Math.min(e.vy+GR*dt,900);moveBody(e,dt)}return}

  const pcx=P.x+P.w/2,ecx=e.x+e.w/2,dx=pcx-ecx,dy=(P.y+P.h)-(e.y+e.h),adx=Math.abs(dx);

    else if(e.state==='chase'){e.face=Math.sign(dx)||e.face;e.vx=e.face*e.spd*1.7;if(alive&&adx<reach&&Math.abs(dy)<44){e.state='wind';e.st=e.type==='rat'?.28:.42;e.vx=0}if(!alive||adx>320||Math.abs(dy)>100)e.state='patrol'}
    else if(e.state==='wind'){e.vx=0;e.st-=dt;e.atk=0;if(e.st<=0){e.state='strike';e.st=.26;if(e.type==='rat'&&e.onGround){e.vx=e.face*240;e.vy=-200}}}
    else if(e.state==='strike'){e.st-=dt;e.atk=1-e.st/.26;const box={x:e.face>0?e.x+e.w-4:e.x-30,y:e.y+4,w:34,h:e.h-8};if(ov(box,P))hurtPlayer(e.dmg,e.face);if(e.st<=0){e.state='cool';e.st=.65;e.atk=0}}
    else if(e.state==='cool'){e.vx=0;e.st-=dt;if(e.st<=0)e.state='chase'}
    if(e.onGround&&e.vx!==0){const ahead=e.vx>0?e.x+e.w+2:e.x-2;const tx=Math.floor(ahead/T),ty=Math.floor((e.y+e.h+4)/T);const c=tileAt(tx,ty);const ground=c===1||isOneway(tx,ty);const wall=tileAt(tx,Math.floor((e.y+e.h-6)/T))===1;const spike=tileAt(tx,ty-1)===4;if(!ground||wall||spike){if(e.state==='patrol')e.face*=-1;if(e.state!=='strike')e.vx=0}}

  }else if(e.type==='musk'){
    e.vx=0;
    if(alive&&adx<460&&Math.abs(dy)<170){e.face=Math.sign(dx)||e.face;e.cd-=dt;if(e.cd<=0&&e.aim<=0)e.aim=.5}
    if(e.aim>0){e.aim-=dt;if(e.aim<=0){const sx=ecx+e.face*30,sy=e.y+18;let ang=Math.atan2((P.y+P.h/2)-sy,pcx-sx);const base=e.face>0?0:Math.PI;let d=ang-base;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;d=clamp(d,-.4,.4);ang=base+d;const v=330+lvl.idx*15;eBul.push({kind:'ball',x:sx,y:sy,vx:Math.cos(ang)*v,vy:Math.sin(ang)*v,dmg:e.dmg,life:3});e.cd=Math.max(1.2,2.3-lvl.idx*.15);e.recoil=.15;SFX.eshoot();smoke(sx,sy,4,'rgba(230,230,230,.6)')}}
    e.vy=Math.min(e.vy+GR*dt,900);moveBody(e,dt);

    else if(e.state==='dive'){const ax=e.tx-ecx,ay=e.ty-(e.y+e.h/2),d=Math.hypot(ax,ay)||1;e.x+=ax/d*250*dt;e.y+=ay/d*250*dt;e.face=Math.sign(ax)||e.face;e.st-=dt;if(e.st<=0||d<8)e.state='return'}

  updatePlayer(dt);
  for(const [key,k] of lvl.crumble){if(k.state==='shake'){k.t-=dt;if(k.t<=0){k.state='gone';k.t=3.5;const tx=key%lvl.w,ty=(key/lvl.w)|0;for(let i=0;i<4;i++)part({type:'debris',x:tx*T+16,y:ty*T+6,vx:rand(-60,60),vy:rand(-80,0),g:1200,life:1,max:1,col:'#8a5a2b',size:rand(4,8),rot:Math.random()*6,vr:rand(-8,8)})}}else if(k.state==='gone'){k.t-=dt;if(k.t<=0){const tx=key%lvl.w,ty=(key/lvl.w)|0;if(!ov(P,{x:tx*T,y:ty*T,w:T,h:T}))k.state='solid';else k.t=.3}}}
  for(const e of enemies)if(!e.dead)updateEnemy(e,dt);
  enemies=enemies.filter(e=>!e.dead);
  // arena
  if(!arena.active&&!arena.done&&arena.bossSpawn&&P.x>arena.x+3*T&&!P.dead){arena.active=true;spawnBoss();SFX.flag()}
  if(boss)updateBoss(dt);
  // barrels
  for(const b of barrels){
    if(b.dead){if(b.arena&&arena.active){b.respawn-=dt;if(b.respawn<=0){b.dead=false;b.x=b.sx;b.y=b.sy-60;b.vx=b.vy=0;b.fuse=-1;b.thrown=false}}continue}
    if(b.carried){b.x=P.x+P.w/2-12;b.y=P.y-26;continue}
    if(b.fuse>=0){b.fuse-=dt;if(b.fuse<0){b.dead=true;b.respawn=7;explode(b.x+12,b.y+14,80,'barrel');continue}}
    b.vy=Math.min(b.vy+GR*dt,900);moveBody(b,dt);
    if(b.onGround)b.vx*=.8;
    if(b.thrown){
      let boom=b.onGround||b.hitWall;
      for(const e of enemies)if(!e.dead&&ov(b,e))boom=true;
      if(boss&&!boss.dead&&ov(b,boss))boom=true;
      if(boom){b.dead=true;b.respawn=7;explode(b.x+12,b.y+14,80,'thrown')}
    }
    if(b.y>lvl.h*T+80){b.dead=true;b.respawn=5}
  }
  // player bullets
  for(const u of pBul){
    u.t+=dt;u.life-=dt;u.x+=u.vx*dt;u.y+=u.vy*dt;
    if(u.kind==='fire'&&Math.random()<.7)part({x:u.x,y:u.y,vx:rand(-30,30),vy:rand(-60,-10),life:.35,max:.35,col:Math.random()<.5?'#ffd25a':'#ff7a1a',size:rand(2,4)});
    if(u.kind==='ice'&&Math.random()<.5)part({x:u.x,y:u.y,vx:rand(-20,20),vy:rand(-20,20),life:.3,max:.3,col:'#c9f6ff',size:2});
    if(solidPt(u.x,u.y)){u.dead=true;burst(u.x,u.y,5,u.kind==='bullet'?'#ffd25a':MAGIC[u.kind].col,120);continue}
    const ub={x:u.x-u.r,y:u.y-u.r,w:u.r*2,h:u.r*2};
    for(const e of enemies){if(!e.dead&&!u.hits.has(e)&&ov(ub,e)){u.hits.add(e);hurtEnemy(e,u.dmg,Math.sign(u.vx),140,{freeze:u.kind==='ice'});if(u.kind==='fire')burst(u.x,u.y,12,'#ff7a1a',200);if(u.kind!=='lightning'){u.dead=true;break}}}
    if(u.dead)continue;
    for(const c of crates)if(!c.dead&&ov(ub,c)){breakCrate(c);u.dead=true;break}
    if(u.dead)continue;
    for(const b of barrels)if(!b.dead&&!b.carried&&b.fuse<0&&ov(ub,b)){b.fuse=.05;u.dead=true;break}
    if(u.dead)continue;
    if(boss&&!boss.dead&&!u.hits.has(boss)&&ov(ub,boss)){u.hits.add(boss);hurtBoss(u.kind==='bullet'?1:u.dmg,'shot');if(u.kind!=='lightning')u.dead=true}
    if(u.life<=0)u.dead=true;
  }
  pBul=pBul.filter(u=>!u.dead);
  // enemy bullets
  for(const u of eBul){
    u.life-=dt;
    if(u.kind==='bomb'){u.vy=Math.min(u.vy+GR*dt,900);u.x+=u.vx*dt;u.y+=u.vy*dt;if(Math.random()<.5)part({x:u.x,y:u.y-8,vy:-40,life:.2,max:.2,col:'#ffd25a',size:2});if(u.fuse<0&&(solidPt(u.x,u.y+8)||isOneway(Math.floor(u.x/T),Math.floor((u.y+8)/T))&&u.vy>0)){u.fuse=.45;u.vx=0;u.vy=0}if(u.fuse>=0){u.fuse-=dt;u.vy=0;u.vx=0;if(u.fuse<0){u.dead=true;explode(u.x,u.y,62,'enemy')}}if(u.y>lvl.h*T+60)u.dead=true;continue}
    if(u.kind==='wave'){u.x+=u.vx*dt;if(Math.random()<.6)part({x:u.x+13,y:u.y+20,vx:rand(-30,30),vy:rand(-90,-30),life:.4,max:.4,col:'rgba(210,190,150,.7)',size:rand(4,7),type:'smoke'});if(ov(u,P))hurtPlayer(u.dmg,Math.sign(u.vx));if(solidPt(u.x+(u.vx>0?u.w:0),u.y+10)||u.life<=0)u.dead=true;continue}
    u.x+=u.vx*dt;u.y+=u.vy*dt;if(u.kind==='knife')u.rot=(u.rot||0)+dt*18;
    if(solidPt(u.x,u.y)){u.dead=true;burst(u.x,u.y,4,'#aaa',100);continue}
    if(ov({x:u.x-4,y:u.y-4,w:8,h:8},P)){hurtPlayer(u.dmg,Math.sign(u.vx)||1);u.dead=true}
    if(u.life<=0)u.dead=true;
  }
  eBul=eBul.filter(u=>!u.dead);
  // pickups
  for(const p of pickups){
    p.t+=dt;
    if(p.phys){p.vy=Math.min(p.vy+GR*dt*.8,700);moveBody(p,dt);if(p.onGround)p.vx*=.85;if(p.life>0){p.life-=dt;if(p.life<=0)p.dead=true}}
    if(!P.dead&&ov(p,P)&&(!p.phys||p.t>.25))collect(p);
  }
  pickups=pickups.filter(p=>!p.dead&&p.y<lvl.h*T+60);
  // flags
  for(const f of flags){if(f.up){f.anim=Math.max(0,f.anim-dt*2);continue}if(!P.dead&&ov({x:f.x,y:f.y-60,w:32,h:60},P)){f.up=true;f.anim=1;checkpoint={x:f.x+5,y:f.y};SFX.flag();popup(f.x+16,f.y-70,'CHECKPOINT','#9effa8');stars(f.x+16,f.y-56)}}
  // particles
  for(const q of parts){q.life-=dt;q.vy+=(q.g||0)*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;if(q.vr)q.rot+=q.vr*dt}
  parts=parts.filter(q=>q.life>0);
  if(banner){banner.t-=dt;if(banner.t<=0)banner=null}
  // camera
  let tx,ty;
  if(arena.active&&!arena.done)tx=arena.x;else tx=P.x+P.w/2-W/2+P.face*50;
  tx=clamp(tx,0,lvl.w*T-W);ty=clamp(P.y+P.h/2-H*.55,0,lvl.h*T-H);
  camX+=(tx-camX)*Math.min(1,dt*(arena.active?3:6));camY+=(ty-camY)*Math.min(1,dt*5);
  shake=Math.max(0,shake-dt*30);
}
function collect(p){
  p.dead=true;const x=p.x+10,y=p.y;
  switch(p.type){
    case 'coin':addScore(100,x,y);SFX.coin();break;
    case 'gem':addScore(p.value,x,y);SFX.gem();stars(x,y+10);break;
    case 'ammo':P.ammo=Math.min(99,P.ammo+5);popup(x,y,'+5 SHOT','#ffd9a0');SFX.coin();break;
    case 'health':if(P.hp>=100)addScore(250,x,y);P.hp=Math.min(100,P.hp+25);popup(x,y-14,'+25 HP','#9effa8');SFX.power();break;
    case 'catnip':P.catnip=15;popup(x,y,'CATNIP!','#d6b0ff');SFX.power();break;
    case 'magic':P.magic={type:p.el,t:25};popup(x,y,MAGIC[p.el].name.toUpperCase()+' BLADE!',MAGIC[p.el].glow);SFX.power();break;
    case 'life':lives=Math.min(9,lives+1);popup(x,y,'EXTRA LIFE','#9effa8');SFX.power();break;
    case 'chart':levelComplete();break;
  }
}
function levelComplete(){
  charts=Math.max(charts,lvlIdx+1);state='done';banner=null;doneT=0;stopSong();SFX.fanfare();
  save.level=Math.min(LEVELS.length-1,Math.max(save.level,lvlIdx+1));save.best=Math.max(save.best,score);writeSave();
}

/* =========================================================
   RENDER
   ========================================================= */
function drawBG(g,bg,cx,cy,info){
  g.drawImage(bg.sky,0,0,W,H);
  for(const L of bg.layers){const iw=1600;let ox=-((cx*L.f)%iw);const oy=-cy*L.f*.4;g.drawImage(L.img,ox,oy,iw,H);g.drawImage(L.img,ox+iw,oy,iw,H)}
  if(info){const wy=lvl?(lvl.h*T-44-cy):H-40;
    if(info.bottom==='water'||info.bottom==='lava'){const lava=info.bottom==='lava';if(lava){const gl=g.createLinearGradient(0,wy-60,0,wy);gl.addColorStop(0,'rgba(255,90,20,0)');gl.addColorStop(1,'rgba(255,90,20,.45)');g.fillStyle=gl;g.fillRect(0,wy-60,W,60)}g.fillStyle=info.bottomCol;g.fillRect(0,wy,W,H-wy+50);g.strokeStyle=lava?'rgba(255,220,90,.75)':'rgba(255,255,255,.35)';g.lineWidth=2;for(let i=0;i<3;i++){g.beginPath();for(let x=0;x<=W;x+=20){const yy=wy+6+i*10+Math.sin((x+cx*.9)*.05+gt*2+i)*3;x?g.lineTo(x,yy):g.moveTo(x,yy)}g.stroke()}}
    else{const gr=g.createLinearGradient(0,wy-30,0,H);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,info.bottomCol);g.fillStyle=gr;g.fillRect(0,wy-30,W,H-wy+80)}}
}
function drawTiles(g){
  const tx0=Math.max(0,Math.floor(camX/T)),tx1=Math.min(lvl.w-1,Math.floor((camX+W)/T)),ty0=Math.max(0,Math.floor(camY/T)),ty1=Math.min(lvl.h-1,Math.floor((camY+H)/T));
  const X=lvl.tex;
  for(let y=ty0;y<=ty1;y++)for(let x=tx0;x<=tx1;x++){
    const c=lvl.t[y][x];if(!c)continue;const sx=Math.round(x*T-camX),sy=Math.round(y*T-camY);
    if(c===1){const img=tileAt(x,y-1)===1?X.fills[(x*7+y*13)%3]:X.top;g.drawImage(img,sx,sy,T,T);if(tileAt(x-1,y)!==1&&x>0){g.fillStyle='rgba(0,0,0,.35)';g.fillRect(sx,sy,3,T)}if(tileAt(x+1,y)!==1&&x<lvl.w-1){g.fillStyle='rgba(0,0,0,.35)';g.fillRect(sx+T-3,sy,3,T)}}
    else if(c===2)g.drawImage(X.plat,sx,sy,T,T);
    else if(c===3)g.drawImage(X.lad,sx,sy,T,T);
    else if(c===4)g.drawImage(X.spike,sx,sy,T,T);
    else if(c===5){const k=lvl.crumble.get(y*lvl.w+x);if(k.state==='gone')continue;const j=k.state==='shake'?rand(-1.5,1.5):0;g.drawImage(X.crumble,sx+j,sy+j*.5,T,T)}
  }
}
function drawEnemy(g,e){
  const x=e.x+e.w/2-camX,y=e.y+e.h-camY;const o={face:e.face,t:e.t,vx:e.vx,flash:e.flash,frozen:e.frozen,atk:e.atk};
  if(e.type==='grunt')drawDog(g,x,y,Object.assign(o,{coat:'#b3262a',fur:'#d8b48a',hat:'shako',weapon:'club'}));
  else if(e.type==='musk')drawDog(g,x,y,Object.assign(o,{coat:'#2d5aa8',fur:'#c9a27a',hat:'shako',weapon:'musket',aim:e.aim,recoil:e.recoil}));
  else if(e.type==='rat')drawRat(g,x,y,Object.assign(o,{fur:'#8d8a92'}));
  else drawFlyer(g,x,e.y+e.h/2-camY,o,lvl.info.flyer);
  if(e.aim>0){g.fillStyle='#ffd25a';g.font='bold 16px Bangers,Impact,sans-serif';g.textAlign='center';g.fillText('!',x,e.y-camY-14)}
}
function drawBoss(g,b){
  const x=b.x+b.w/2-camX,y=b.y+b.h-camY;
  const o={face:b.face,t:b.t,vx:b.vx,flash:b.flash,s:b.s,coat:b.coat,fur:b.fur,hat:b.hat,weapon:b.weapon,boss:true,wig:b.wig,atk:b.atk,aim:b.aim,recoil:b.recoil,beard:b.beard};
  if(b.state==='wind'){g.save();g.translate(rand(-2,2),0)}
  if(b.kind==='rat')drawRat(g,x,y,o);else drawDog(g,x,y,o);
  if(b.state==='wind')g.restore();
  if(b.state==='stun'){for(let i=0;i<3;i++){const a=b.t*5+i*2.1;g.fillStyle='#ffe58a';ell(g,x+Math.cos(a)*18,y-b.h-8+Math.sin(a)*5,3,3)}}
}
function drawWorld(g){
  const sx=shake?rand(-shake,shake)*.5:0,sy=shake?rand(-shake,shake)*.5:0;
  drawBG(g,lvl.bg,camX,camY,lvl.info);
  g.save();g.translate(sx,sy);
  for(const t of torches){const x=t.x-camX;if(x>-40&&x<W+40)drawTorch(g,x,t.y-camY,gt)}
  drawTiles(g);
  for(const pl of plats){const x=pl.x-camX,y=pl.y-camY;for(let i=0;i<3;i++)g.drawImage(lvl.tex.plat,x+i*T,y-2,T,T);g.strokeStyle='rgba(220,200,150,.6)';g.lineWidth=1.5;ln(g,x+4,y,x+4,y-30);ln(g,x+pl.w-4,y,x+pl.w-4,y-30)}
  for(const f of flags){const x=f.x-camX;if(x>-60&&x<W+20)drawFlag(g,{x,y:f.y-camY,up:f.up,anim:f.anim},gt)}
  for(const c of crates)if(!c.dead)drawCrate(g,c.x-camX,c.y-camY);
  for(const b of barrels)if(!b.dead&&!b.carried)drawBarrel(g,b.x-camX,b.y-camY,b.fuse>=0||b.thrown);
  for(const p of pickups){const x=p.x-camX;if(x>-30&&x<W+30&&(p.life<0||p.life>2||Math.floor(p.life*10)%2))drawPickup(g,{...p,x,y:p.y-camY},gt)}
  for(const e of enemies){const x=e.x-camX;if(x>-80&&x<W+80)drawEnemy(g,e)}
  if(boss)drawBoss(g,boss);
  // player
  if(P){
    const p=P;let st='idle';
    if(p.dead)st='dead';else if(p.climb)st='climb';else if(p.hurtT>0)st='hurt';else if(!p.onGround)st=p.vy<0?'jump':'fall';else if(Math.abs(p.vx)>20)st='run';
    const blinkA=p.invuln>0&&!p.dead&&Math.floor(p.invuln*14)%2===0;
    const atkP=p.atk>0?1-p.atk/p.atkDur:0;
    if(p.catnip>0){g.fillStyle='rgba(200,150,255,.18)';ell(g,p.x+p.w/2-camX,p.y+p.h/2-camY,26,30)}
    g.save();if(p.dead){g.translate(p.x+p.w/2-camX,p.y+p.h-camY);g.rotate(Math.min(1.4,(1.8-p.deadT)*3)*-p.face);g.translate(-(p.x+p.w/2-camX),-(p.y+p.h-camY))}
    drawCat(g,p.x+p.w/2-camX,p.y+p.h-camY,{face:p.face,t:p.t,state:st,atk:p.atk,atkP,atkKind:p.atkKind,shoot:p.shoot,carry:!!p.carry,magic:p.magic.t>0?p.magic.type:null,blinkA,blink:p.blinkT<0});
    g.restore();
    if(p.carry)drawBarrel(g,p.x+p.w/2-12-camX,p.y-26-camY,false);
  }
  // bullets
  for(const u of pBul){const x=u.x-camX,y=u.y-camY;
    if(u.kind==='bullet'){g.fillStyle='rgba(255,220,120,.4)';g.fillRect(x-u.vx*.02,y-1,u.vx*.02,2);g.fillStyle='#ffd25a';ell(g,x,y,3.5,3)}
    else if(u.kind==='fire'){g.fillStyle='rgba(255,120,30,.35)';ell(g,x,y,13,10);g.fillStyle='#ff7a1a';ell(g,x,y,8,6.5);g.fillStyle='#ffe58a';ell(g,x+Math.sign(u.vx)*2,y,4,3)}
    else if(u.kind==='ice'){g.save();g.translate(x,y);g.rotate(u.t*8);g.fillStyle='#c9f6ff';g.beginPath();for(let i=0;i<6;i++){const a=i/6*Math.PI*2;g.lineTo(Math.cos(a)*(i%2?4:9),Math.sin(a)*(i%2?4:9))}g.fill();g.restore()}
    else{g.strokeStyle='#fff7b0';g.lineWidth=3;g.shadowColor='#ffe94a';g.shadowBlur=12;g.beginPath();g.moveTo(x-Math.sign(u.vx)*30,y);for(let i=1;i<=5;i++)g.lineTo(x-Math.sign(u.vx)*(30-i*6),y+rand(-6,6));g.stroke();g.shadowBlur=0}
  }
  for(const u of eBul){const x=u.x-camX,y=u.y-camY;
    if(u.kind==='ball'){g.fillStyle='#2a2a30';ell(g,x,y,4.5,4.5);g.fillStyle='#777';ell(g,x-1.2,y-1.2,1.5,1.5)}
    else if(u.kind==='knife'){g.save();g.translate(x,y);g.rotate(u.rot);g.fillStyle='#d8dee6';tri(g,-2,-2,12,0,-2,2);g.fillStyle='#5a3010';g.fillRect(-8,-1.5,6,3);g.restore()}
    else if(u.kind==='bomb'){g.fillStyle='#1a1a20';ell(g,x,y,8,8);g.fillStyle='#555';ell(g,x-2.5,y-2.5,2.5,2.5);g.strokeStyle='#8a6a3a';g.lineWidth=2;ln(g,x+3,y-6,x+6,y-11);if(u.fuse>=0&&Math.floor(u.fuse*20)%2){g.fillStyle='rgba(255,60,30,.6)';ell(g,x,y,10,10)}}
    else if(u.kind==='wave'){g.fillStyle='rgba(210,180,130,.55)';g.beginPath();g.moveTo(x,y+u.h);g.quadraticCurveTo(x+u.w/2,y-6,x+u.w,y+u.h);g.fill()}
  }
  // particles
  for(const q of parts){const x=q.x-camX,y=q.y-camY,a=Math.max(0,q.life/q.max);
    if(q.type==='text'){g.globalAlpha=Math.min(1,a*2);g.font='20px Bangers,Impact,sans-serif';g.textAlign='center';g.lineWidth=3;g.strokeStyle='#2a1406';g.strokeText(q.txt,x,y);g.fillStyle=q.col;g.fillText(q.txt,x,y);g.globalAlpha=1}
    else if(q.type==='corpse'){g.save();g.translate(x,y-20);g.rotate(q.rot);g.translate(0,20);const o={face:q.face,t:0};if(q.ek==='grunt')drawDog(g,0,0,Object.assign(o,{coat:'#b3262a',fur:'#d8b48a',hat:'shako',weapon:'club'}));else if(q.ek==='musk')drawDog(g,0,0,Object.assign(o,{coat:'#2d5aa8',fur:'#c9a27a',hat:'shako',weapon:'musket'}));else if(q.ek==='rat')drawRat(g,0,0,Object.assign(o,{fur:'#8d8a92'}));else drawFlyer(g,0,-10,o,lvl.info.flyer);g.restore()}
    else if(q.type==='ring'){g.strokeStyle=`rgba(255,220,140,${a})`;g.lineWidth=6*a;g.beginPath();g.arc(x,y,q.r*(1-a*.6),0,7);g.stroke()}
    else if(q.type==='smoke'){g.globalAlpha=a*.8;g.fillStyle=q.col;ell(g,x,y,q.size*(1.6-a),q.size*(1.6-a));g.globalAlpha=1}
    else if(q.type==='debris'){g.save();g.translate(x,y);g.rotate(q.rot);g.fillStyle=q.col;g.fillRect(-q.size/2,-q.size/4,q.size,q.size/2);g.restore()}
    else if(q.type==='star'){g.globalAlpha=a;g.fillStyle=q.col;g.save();g.translate(x,y);g.rotate(gt*6);g.beginPath();for(let i=0;i<10;i++){const r=i%2?2:6,an=i/10*Math.PI*2;g.lineTo(Math.cos(an)*r,Math.sin(an)*r)}g.fill();g.restore();g.globalAlpha=1}
    else{g.globalAlpha=a;g.fillStyle=q.col;g.fillRect(x-q.size/2,y-q.size/2,q.size,q.size);g.globalAlpha=1}
  }
  g.restore();
  const wx=lvl.info.weather;
  if(wx==='snow'){g.fillStyle='rgba(255,255,255,.85)';for(let i=0;i<70;i++){const sp=30+(i%5)*12,r=1.2+(i%3)*.6;const x=(((i*137.5+gt*(8+i%7*3)-camX*.6)%W)+W)%W;const y=((i*91.3+gt*sp)%(H+20))-10;ell(g,x+Math.sin(gt+i)*6,y,r,r)}}
  else if(wx==='embers'){for(let i=0;i<40;i++){const sp=25+(i%5)*10;const x=(((i*137.5-camX*.6+Math.sin(gt*.7+i)*20)%W)+W)%W;const y=H-(((i*91.3+gt*sp)%(H+20))-10);g.fillStyle=i%3?'rgba(255,140,40,.8)':'rgba(255,220,90,.9)';g.fillRect(x,y,2,2)}}
}
function txt(g,s,x,y,size,col,align,font,stroke){g.font=`${size}px ${font||"Bangers,Impact,sans-serif"}`;g.textAlign=align||'left';g.textBaseline='alphabetic';g.lineJoin='round';g.lineWidth=stroke===undefined?Math.max(3,size/6):stroke;g.strokeStyle='#1c0e04';if(g.lineWidth)g.strokeText(s,x,y);g.fillStyle=col||'#fff';g.fillText(s,x,y)}
function drawHUD(g){
  // treasure
  g.save();g.translate(14,12);g.fillStyle='#6b4420';rr(g,0,8,26,16,3);g.fill();g.fillStyle='#8a5a2b';rr(g,0,2,26,10,5);g.fill();g.fillStyle='#d9a521';g.fillRect(0,11,26,3);g.fillRect(11,9,5,8);g.fillStyle='#f2c230';ell(g,6,4,3,2);ell(g,18,3,3,2);g.restore();
  txt(g,String(score).padStart(8,'0'),48,34,26,'#ffd94a');
  // health
  const hx=W-14;txt(g,String(Math.max(0,Math.ceil(P.hp))),hx,34,28,P.hp>30?'#ff6a5a':(Math.floor(gt*6)%2?'#ff2a1a':'#fff'),'right');
  g.save();g.translate(hx-58,22);g.fillStyle='#e0303a';g.beginPath();g.moveTo(0,6);g.bezierCurveTo(-10,-4,-4,-12,0,-5);g.bezierCurveTo(4,-12,10,-4,0,6);g.fill();g.restore();
  // lives / ammo / magic / catnip
  let y=56;
  const row=(icon,label,col)=>{g.save();g.translate(W-90,y);icon(g);g.restore();txt(g,label,W-14,y+8,20,col||'#fff','right');y+=26};
  row(g2=>{g2.scale(.9,.9);g2.fillStyle='#e8902f';tri(g2,-7,-3,-8,-11,-2,-6);tri(g2,2,-6,8,-11,7,-3);ell(g2,0,0,8,7);g2.fillStyle='#c8312b';g2.fillRect(-8,-6,16,3)},'x '+lives);
  row(g2=>{g2.fillStyle='#333';g2.fillRect(-6,-4,16,4);g2.fillStyle='#5a3010';g2.fillRect(-8,-2,6,9);g2.fillStyle='#c9a227';g2.fillRect(-4,-1,3,2)},'x '+P.ammo);
  if(P.magic.t>0)row(g2=>{g2.rotate(-.7);g2.scale(.7,.7);sword(g2,P.magic.type,gt)},Math.ceil(P.magic.t)+'s',MAGIC[P.magic.type].glow);
  if(P.catnip>0)row(g2=>{g2.fillStyle='#56b03a';ell(g2,-4,0,5,2.6,-.5);ell(g2,4,-2,5,2.6,.5);g2.fillStyle='#b48ae0';ell(g2,0,-6,2,2)},Math.ceil(P.catnip)+'s','#d6b0ff');
  // chart pieces
  for(let i=0;i<NCH;i++){const x=W/2-NCH*13+i*26,yy=14;g.fillStyle=i<charts?'#e8d3a0':'rgba(0,0,0,.35)';rr(g,x,yy,22,18,2);g.fill();g.strokeStyle=i<charts?'#8a6a3a':'rgba(255,255,255,.3)';g.lineWidth=1;g.stroke();if(i<charts){g.strokeStyle='#c8312b';g.lineWidth=1.6;ln(g,x+8,yy+6,x+14,yy+12);ln(g,x+14,yy+6,x+8,yy+12)}}
  // boss bar
  if(boss&&boss.state!=='intro'){const bw=360,bx=W/2-bw/2,by=H-34;g.fillStyle='rgba(0,0,0,.6)';rr(g,bx-4,by-4,bw+8,22,6);g.fill();g.fillStyle='#4a0e0e';g.fillRect(bx,by,bw,14);g.fillStyle='#d8302a';g.fillRect(bx,by,bw*boss.hp/boss.max,14);g.fillStyle='rgba(255,255,255,.25)';g.fillRect(bx,by,bw*boss.hp/boss.max,4);txt(g,boss.name,W/2,by-8,18,'#ffe2b0','center')}
  if(banner){const a=Math.min(1,banner.t*2);g.globalAlpha=a;txt(g,banner.txt,W/2,H/2-70,48,'#ffd94a','center',"'Pirata One',serif",6);g.globalAlpha=1}
  if(muted)txt(g,'MUTED',14,H-12,16,'#bbb');
}
function panel(g,x,y,w,h){g.fillStyle='rgba(20,10,4,.82)';rr(g,x,y,w,h,12);g.fill();g.strokeStyle='#c99a5b';g.lineWidth=3;g.stroke();g.strokeStyle='rgba(255,220,150,.25)';g.lineWidth=1;rr(g,x+6,y+6,w-12,h-12,8);g.stroke()}
function drawTitle(g){
  const bg=getBG('docks');const cx=titleT*40;
  drawBG(g,bg,cx,0,null);
  g.fillStyle=THEME_INFO.docks.bottomCol;g.fillRect(0,H-46,W,46);
  const tx=getTex('docks');for(let x=-((cx)%T);x<W;x+=T){g.drawImage(tx.top,x,H-80,T,T);g.drawImage(tx.fills[0],x,H-48,T,T)}
  g.fillStyle='rgba(0,0,0,.25)';g.fillRect(0,0,W,H);
  txt(g,'Calico Cutlass',W/2,112,86,'#ffd94a','center',"'Pirata One',serif",10);
  txt(g,'Quest for the Ninth-Tide Compass',W/2,150,26,'#ffe9c4','center');
  drawCat(g,170,H-80,{face:1,t:titleT,state:'idle',s:2.4,atk:Math.sin(titleT*1.3)>.96?.1:0,atkP:.5,atkKind:'slash',blink:(titleT%3.5)>3.35});
  drawDog(g,640,H-80,{face:-1,t:titleT,s:1.9,coat:'#b3262a',fur:'#d8b48a',hat:'shako',weapon:'club'});
  drawRat(g,720,H-80,{face:-1,t:titleT,s:1.6,fur:'#8d8a92'});
  panel(g,W/2-170,190,340,150);
  const L=[['Move','Arrows / WASD'],['Jump','Space / Up'],['Sword','Z or J  (3-hit combo)'],['Pistol','X or K'],['Grab / throw barrel','C or L'],['Climb','Up / Down on ladders'],['Pause / Mute','P  /  M']];
  L.forEach((r,i)=>{txt(g,r[0],W/2-150,216+i*18,16,'#ffd9a0','left',null,2);txt(g,r[1],W/2+150,216+i*18,16,'#fff','right',null,2)});
  if(Math.floor(titleT*2)%2)txt(g,'Press Enter or tap to set sail',W/2,372,26,'#fff','center');
  if(save.level>0)txt(g,'Press N to continue from Level '+(save.level+1),W/2,398,18,'#9effa8','center');
  if(save.best>0)txt(g,'Best treasure: '+save.best,W-14,H-10,14,'#ffe9c4','right',null,2);
}
function drawStory(g){
  drawBG(g,getBG('docks'),titleT*20,0,null);g.fillStyle='rgba(8,4,0,.65)';g.fillRect(0,0,W,H);
  panel(g,90,60,620,320);
  txt(g,'The Story So Far',W/2,112,46,'#ffd94a','center',"'Pirata One',serif",6);
  const lines=['Captain Calico, the most wanted cat on the Saltwater Coast,','sits locked in the brig of Fort Barkwater, guarded by the','Bulldog Brigade.','','The Brigade has torn the Tidewright Chart into eight pieces.','Put them back together and the chart leads to the','Ninth-Tide Compass, which points the way to any treasure.','','Break out, collect all eight pieces, and get there first.'];
  lines.forEach((l,i)=>txt(g,l,W/2,152+i*22,18,'#ffe9c4','center',null,2));
  if(Math.floor(titleT*2)%2)txt(g,'Press Enter',W/2,362,22,'#fff','center');
}
function drawOverlay(g,title,lines,foot,col){
  g.fillStyle='rgba(8,4,0,.6)';g.fillRect(0,0,W,H);
  const h=110+lines.length*26;panel(g,W/2-230,H/2-h/2,460,h);
  txt(g,title,W/2,H/2-h/2+56,42,col||'#ffd94a','center',"'Pirata One',serif",6);
  lines.forEach((l,i)=>txt(g,l,W/2,H/2-h/2+92+i*26,20,'#ffe9c4','center',null,2));
  if(foot&&Math.floor(gt*2+titleT*2)%2)txt(g,foot,W/2,H/2+h/2-16,18,'#fff','center',null,2);
}
function render(){
  ctx.setTransform(K,0,0,K,0,0);ctx.imageSmoothingEnabled=true;
  if(state==='title'){drawTitle(ctx);return}
  if(state==='story'){drawStory(ctx);return}
  drawWorld(ctx);drawHUD(ctx);
  if(state==='intro'){const d=LEVELS[lvlIdx];drawOverlay(ctx,'Level '+(lvlIdx+1)+': '+d.name,[d.blurb,'Find the chart piece at the end of the level.'],'Press Enter')}
  else if(state==='paused')drawOverlay(ctx,'Paused',['P to resume   M to mute'],null);
  else if(state==='done'){const t=Math.floor(lvlStats.time);drawOverlay(ctx,'Level Clear!',['Chart piece '+charts+' of '+NCH+' recovered','Treasure: '+lvlStats.treasure+'     Foes beaten: '+lvlStats.kills,'Time: '+Math.floor(t/60)+':'+String(t%60).padStart(2,'0')],lvlIdx+1<LEVELS.length?'Press Enter for the next level':'Press Enter')}
  else if(state==='gameover')drawOverlay(ctx,'Game Over',['The Brigade got you this time.','Score: '+score],'Press Enter to retry the level','#ff6a5a');
  else if(state==='win')drawOverlay(ctx,'The Compass Is Yours!',['All eight pieces of the Tidewright Chart','lead Captain Calico to the Ninth-Tide Compass.','Final treasure: '+score,'Best: '+save.best],'Press Enter for the title screen');
}

/* =========================================================
   FLOW
   ========================================================= */
function newGame(){score=0;lives=9;nextLife=50000;charts=0;state='story';SFX.click()}
function startLevel(i){lvlIdx=i;buildLevel(i);levelStartScore=score;charts=Math.max(charts,i);lvlStats={treasure:0,kills:0,time:0};state='intro';introT=4;gt=0;banner=null;playSong(LEVELS[i].song)}
function update(dt){
  if(hit('mute')){muted=!muted;if(musicGain)musicGain.gain.value=muted?0:.32}
  titleT+=dt;
  switch(state){
    case 'title':if(pressed.start||pressed.jump){pressed.start=pressed.jump=false;newGame()}else if(hit('cont')&&save.level>0){score=0;lives=9;charts=save.level;startLevel(save.level)}if(!music.on&&AC)playSong(4);break;
    case 'story':if(hit('start')||hit('jump')||hit('attack'))startLevel(0);break;
    case 'intro':gt+=dt;introT-=dt;if(introT<=0||hit('start')||hit('jump'))state='play';break;
    case 'play':if(hit('pause')){state='paused';break}{const steps=dt>1/70?2:1;for(let i=0;i<steps;i++){updateWorld(dt/steps);if(state!=='play')break}}break;
    case 'paused':if(hit('pause')||hit('start'))state='play';break;
    case 'done':doneT+=dt;if(doneT>.8&&hit('start')){if(lvlIdx+1<LEVELS.length)startLevel(lvlIdx+1);else{state='win';save.best=Math.max(save.best,score);save.level=0;writeSave();playSong(4)}}break;
    case 'gameover':if(hit('start')){lives=9;score=levelStartScore;nextLife=Math.ceil((score+1)/50000)*50000;startLevel(lvlIdx)}break;
    case 'win':if(hit('start')){state='title';titleT=0}break;
  }
  for(const k in pressed)pressed[k]=false;
}
let last=performance.now();
function frame(now){
  let dt=(now-last)/1000;last=now;dt=Math.min(dt,1/30);
  try{update(dt);render()}catch(err){console.error(err)}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__G={get state(){return state},set state(v){state=v},get P(){return P},get lvl(){return lvl},get boss(){return boss},get enemies(){return enemies},get arena(){return arena},get plats(){return plats},startLevel,keys,pressed,CH,LEVELS,get score(){return score}};
</script>
