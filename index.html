function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function mk(w,h,fn){const c=document.createElement('canvas');c.width=w*RS;c.height=h*RS;const g=c.getContext('2d');g.scale(RS,RS);fn(g,w,h);return c}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function tri(g,a,b,c,d,e,f){g.beginPath();g.moveTo(a,b);g.lineTo(c,d);g.lineTo(e,f);g.closePath();g.fill()}
function ell(g,x,y,rx,ry,rot){g.beginPath();g.ellipse(x,y,rx,ry,rot||0,0,Math.PI*2);g.fill()}
function ln(g,a,b,c,d){g.beginPath();g.moveTo(a,b);g.lineTo(c,d);g.stroke()}
function shade(hex,amt){let c=parseInt(hex.slice(1),16),r=c>>16,g=c>>8&255,b=c&255;if(amt<0){r*=1+amt;g*=1+amt;b*=1+amt}else{r+=(255-r)*amt;g+=(255-g)*amt;b+=(255-b)*amt}return`rgb(${r|0},${g|0},${b|0})`}

let AC=null,master=null,musicGain=null,muted=false,noiseBuf=null;
function audioInit(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=0.55;master.connect(AC.destination);musicGain=AC.createGain();musicGain.gain.value=0.32;musicGain.connect(master);if(pendingSong!==null)playSong(pendingSong);}catch(e){AC=null}}

const music={on:false,step:0,next:0,song:null,timer:null};let pendingSong=null;
function note(m,d,type,v,t){const f=440*Math.pow(2,(m-69)/12);const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+0.01);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(g);g.connect(musicGain);o.start(t);o.stop(t+d+0.05)}
function playSong(i){pendingSong=i;if(!AC)return;music.song=SONGS[i];music.step=0;music.next=AC.currentTime+0.1;music.on=true;if(!music.timer)music.timer=setInterval(schedule,25)}
function stopSong(){music.on=false;pendingSong=null}
function schedule(){if(!AC||!music.on||!music.song)return;const s=music.song,st=60/s.bpm/2;while(music.next<AC.currentTime+0.15){const i=music.step%s.lead.length;if(!muted){const n=s.lead[i];if(n)note(n,st*0.85,s.wave,0.045,music.next);if(i%2===0){const b=s.bass[(i/2)%s.bass.length];if(b)note(b,st*1.7,'triangle',0.11,music.next)}}music.step++;music.next+=st}}

function starsOf(i){return save.stars[i]|0}
function PLG(){return !!save.plague}

function mStars(i){return PLG()&&i<NCH?((save.pstars||[])[i]|0):save.legend&&i<NCH?((save.lstars||[])[i]|0):starsOf(i)}
function mStarTotal(){let n=0;for(let i=0;i<NCH;i++){const s=mStars(i);n+=(s&1)+((s>>1)&1)+((s>>2)&1)}return n}

function plank(g,x,y,w,h,c){g.fillStyle=c;g.fillRect(x,y,w,h);g.fillStyle=shade(c,.28);g.fillRect(x,y,w,2);g.fillStyle=shade(c,-.4);g.fillRect(x,y+h-2,w,2);g.fillStyle='rgba(0,0,0,.3)';g.fillRect(x+w-1,y,1,h);g.fillStyle='#2a1a0a';g.fillRect(x+3,y+h/2-1,2,2);g.fillRect(x+w-6,y+h/2-1,2,2);g.strokeStyle='rgba(60,30,10,.35)';g.lineWidth=1;ln(g,x+7,y+h*.4,x+w-9,y+h*.4)}
function ladderTex(){return mk(T,T,g=>{g.strokeStyle='#5b3a1a';g.lineWidth=3;ln(g,7,0,7,T);ln(g,25,0,25,T);g.strokeStyle='#c99a5b';g.lineWidth=1;ln(g,6,0,6,T);ln(g,24,0,24,T);[8,24].forEach(y=>{g.fillStyle='#8a5a2b';g.fillRect(6,y-2,20,4);g.fillStyle='#b98244';g.fillRect(6,y-2,20,1)})})}
function spikeTex(c1,c2){return mk(T,T,g=>{for(let i=0;i<4;i++){const x=i*8;g.fillStyle=c1;tri(g,x,T,x+4,T-16,x+8,T);g.fillStyle=c2;tri(g,x+4,T-16,x+8,T,x+5,T)}})}
function crumbleFrom(plat){return mk(T,T,g=>{g.drawImage(plat,0,0,T,T);g.strokeStyle='rgba(30,10,0,.8)';g.lineWidth=1.2;g.beginPath();g.moveTo(8,0);g.lineTo(12,5);g.lineTo(9,10);g.moveTo(22,0);g.lineTo(19,6);g.lineTo(24,10);g.stroke()})}

function tileAt(tx,ty){if(ty<0||ty>=lvl.h)return 0;if(tx<0||tx>=lvl.w)return 1;return lvl.t[ty][tx]}

function moveBody(b,dt,noOne){
  b.onGround=false;b.hitWall=0;
  b.x+=b.vx*dt;
  let top=Math.floor(b.y/T),bot=Math.floor((b.y+b.h-.01)/T);
  if(b.vx>0){const tx=Math.floor((b.x+b.w)/T);for(let ty=top;ty<=bot;ty++)if(tileAt(tx,ty)===1){b.x=tx*T-b.w-.01;b.hitWall=1;break}}
  else if(b.vx<0){const tx=Math.floor(b.x/T);for(let ty=top;ty<=bot;ty++)if(tileAt(tx,ty)===1){b.x=(tx+1)*T+.01;b.hitWall=-1;break}}
  if(b.hitWall)b.vx=0;
  const prevBottom=b.y+b.h;
  b.y+=b.vy*dt;
  const l=Math.floor(b.x/T),r=Math.floor((b.x+b.w-.01)/T);
  if(b.vy>0){const ty=Math.floor((b.y+b.h)/T);for(let tx=l;tx<=r;tx++){const c=tileAt(tx,ty);if(c===1||(!noOne&&isOneway(tx,ty)&&prevBottom<=ty*T+1.5)){b.y=ty*T-b.h;b.vy=0;b.onGround=true;b.gty=ty;b.groundTile=c;break}}}
  else if(b.vy<0){const ty=Math.floor(b.y/T);for(let tx=l;tx<=r;tx++)if(tileAt(tx,ty)===1){b.y=(ty+1)*T;b.vy=0;break}}
}

    else if(keys.down&&p.onGround&&ladderBelow){p.climb=true;p.y+=4}
  }

  p.rideWas=p.ride;if(p.ride&&p.onGround)p.x+=p.ride.dx;
  p.ride=null;
  const prevBottom=p.y+p.h;
  p.ropeCd=(p.ropeCd||0)-dt;p.zipCd=(p.zipCd||0)-dt;p.wlock=(p.wlock||0)-dt;p.wallT=(p.wallT||0)-dt;

    if(inp)p.face=inp;else if(Math.abs(r.w)>.4)p.face=Math.sign(r.w);
    p.x=r.ax+Math.sin(r.a)*p.ropeL-p.w/2;p.y=r.ay+Math.cos(r.a)*p.ropeL-8;p.vx=0;p.vy=0;p.onGround=false;p.dj=false;
    if(hit('jump')||hit('up')){const v=r.w*p.ropeL;p.vx=v*Math.cos(r.a)+p.face*40;p.vy=-v*Math.sin(r.a)-430;r.held=false;p.rope=null;p.ropeCd=.35;SFX.jump()}

  if(info){const wy=lvl?(lvl.h*T-44-cy):H-40;
    if(info.bottom==='water'||info.bottom==='lava'){const lava=info.bottom==='lava';if(lava){const gl=g.createLinearGradient(0,wy-60,0,wy);gl.addColorStop(0,'rgba(255,90,20,0)');gl.addColorStop(1,'rgba(255,90,20,.45)');g.fillStyle=gl;g.fillRect(0,wy-60,W,60)}g.fillStyle=info.bottomCol;g.fillRect(0,wy,W,H-wy+50);g.strokeStyle=lava?'rgba(255,220,90,.75)':'rgba(255,255,255,.35)';g.lineWidth=2;for(let i=0;i<3;i++){g.beginPath();for(let x=0;x<=W;x+=20){const yy=wy+6+i*10+Math.sin((x+cx*.9)*.05+gt*2+i)*3;x?g.lineTo(x,yy):g.moveTo(x,yy)}g.stroke()}}

}
function drawTiles(g){

  const X=lvl.tex;
  for(let y=ty0;y<=ty1;y++)for(let x=tx0;x<=tx1;x++){
    const c=lvl.t[y][x];if(!c)continue;const sx=Math.round(x*T-camX),sy=Math.round(y*T-camY);
    if(c===1&&lvl.k.size){const kk=lvl.k.get(y*lvl.w+x);if(kk){drawKindTile(g,kk,sx,sy,x,y);continue}}
    if(c===1){const img=tileAt(x,y-1)===1?X.fills[(x*7+y*13)%3]:X.top;g.drawImage(img,sx,sy,T,T);if(tileAt(x-1,y)!==1&&x>0){g.fillStyle='rgba(0,0,0,.35)';g.fillRect(sx,sy,3,T)}if(tileAt(x+1,y)!==1&&x<lvl.w-1){g.fillStyle='rgba(0,0,0,.35)';g.fillRect(sx+T-3,sy,3,T)}}
