.tb.on{background:rgba(255,200,90,.45)}
</style>

<body>
<div id="wrap"><canvas id="c" width="800" height="450"></canvas></div>
<div id="touch">
  <div class="tb" data-k="left"  style="left:16px;bottom:70px">&#9664;</div>
  <div class="tb" data-k="right" style="left:120px;bottom:70px">&#9654;</div>
  <div class="tb" data-k="up"    style="left:68px;bottom:136px">&#9650;</div>
  <div class="tb" data-k="down"  style="left:68px;bottom:6px">&#9660;</div>
  <div class="tb" data-k="grab"  style="right:150px;bottom:136px">GRAB</div>
  <div class="tb" data-k="shoot" style="right:84px;bottom:136px">GUN</div>

<script>
'use strict';
/* =========================================================
   CALICO CUTLASS  -  an original pirate-cat platformer
   Single file. No external assets. All art drawn in code.
   ========================================================= */
const W=800,H=450,T=32,RS=2,GR=1800;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let K=1;
function resize(){const s=Math.min(innerWidth/W,innerHeight/H);const dpr=Math.min(window.devicePixelRatio||1,2);K=s*dpr;cv.width=Math.round(W*K);cv.height=Math.round(H*K);cv.style.width=Math.round(W*s)+'px';cv.style.height=Math.round(H*s)+'px';}
addEventListener('resize',resize);resize();

/* ---------- helpers ---------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function mk(w,h,fn){const c=document.createElement('canvas');c.width=w*RS;c.height=h*RS;const g=c.getContext('2d');g.scale(RS,RS);fn(g,w,h);return c}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function tri(g,a,b,c,d,e,f){g.beginPath();g.moveTo(a,b);g.lineTo(c,d);g.lineTo(e,f);g.closePath();g.fill()}
function ell(g,x,y,rx,ry,rot){g.beginPath();g.ellipse(x,y,rx,ry,rot||0,0,Math.PI*2);g.fill()}
function ln(g,a,b,c,d){g.beginPath();g.moveTo(a,b);g.lineTo(c,d);g.stroke()}
function shade(hex,amt){let c=parseInt(hex.slice(1),16),r=c>>16,g=c>>8&255,b=c&255;if(amt<0){r*=1+amt;g*=1+amt;b*=1+amt}else{r+=(255-r)*amt;g+=(255-g)*amt;b+=(255-b)*amt}return`rgb(${r|0},${g|0},${b|0})`}
const HAS_FILTER='filter' in ctx;

/* ---------- input ---------- */
const keys={},pressed={};
const KEYMAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',Space:'jump',KeyZ:'attack',KeyJ:'attack',KeyX:'shoot',KeyK:'shoot',KeyC:'grab',KeyL:'grab',KeyE:'grab',Enter:'start',NumpadEnter:'start',KeyP:'pause',Escape:'pause',KeyM:'mute',KeyN:'cont',KeyQ:'quit',KeyB:'shop',KeyG:'mode',KeyH:'scores',KeyV:'battle',KeyI:'isles',KeyO:'journal'};
addEventListener('keydown',e=>{if(state==='entry'&&/^[a-z0-9]$/i.test(e.key)&&!e.repeat){entryType(e.key.toUpperCase());e.preventDefault();audioInit();return}const k=KEYMAP[e.code];if(k){if(!keys[k])pressed[k]=true;keys[k]=true;e.preventDefault();}audioInit();});
addEventListener('keyup',e=>{const k=KEYMAP[e.code];if(k){keys[k]=false;e.preventDefault();}});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;if(state==='play')state='paused'});
function hit(k){if(pressed[k]){pressed[k]=false;return true}return false}
let lastTap=null;
cv.addEventListener('pointerdown',e=>{audioInit();const r=cv.getBoundingClientRect();lastTap={x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};pressed.start=true});
(function touchSetup(){
  const coarse=matchMedia('(pointer:coarse)').matches||('ontouchstart' in window);
  if(!coarse)return;
  const tc=document.getElementById('touch');tc.style.display='block';
  tc.querySelectorAll('.tb').forEach(b=>{
    const k=b.dataset.k;
    const on=e=>{e.preventDefault();audioInit();if(!keys[k])pressed[k]=true;keys[k]=true;b.classList.add('on');if(state!=='play'&&state!=='map'&&state!=='bmap'&&state!=='journal'&&state!=='shop'&&state!=='battle'&&state!=='kraken'&&state!=='entry'&&k!=='pause')pressed.start=true;};
    const off=e=>{e.preventDefault();keys[k]=false;b.classList.remove('on')};
    b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off);
  });
})();

/* ---------- audio ---------- */
let AC=null,master=null,musicGain=null,muted=false,noiseBuf=null;
function audioInit(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=0.55;master.connect(AC.destination);musicGain=AC.createGain();musicGain.gain.value=0.32;musicGain.connect(master);if(pendingSong!==null)playSong(pendingSong);}catch(e){AC=null}}
function tone(f,d,type,v,slide,delay){if(!AC||muted)return;const t=AC.currentTime+(delay||0);const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(v||0.1,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+0.03)}
function noise(d,v,freq,delay){if(!AC||muted)return;if(!noiseBuf){noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const a=noiseBuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}const t=AC.currentTime+(delay||0);const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=freq||1200;const g=AC.createGain();g.gain.setValueAtTime(v||0.2,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+d+0.03)}

const music={on:false,step:0,next:0,song:null,timer:null};let pendingSong=null;
function note(m,d,type,v,t){const f=440*Math.pow(2,(m-69)/12);const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+0.01);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(g);g.connect(musicGain);o.start(t);o.stop(t+d+0.05)}
function playSong(i){pendingSong=i;if(!AC)return;music.song=SONGS[i];music.step=0;music.next=AC.currentTime+0.1;music.on=true;if(!music.timer)music.timer=setInterval(schedule,25)}
function stopSong(){music.on=false;pendingSong=null}
function schedule(){if(!AC||!music.on||!music.song)return;const s=music.song,st=60/s.bpm/2;while(music.next<AC.currentTime+0.15){const i=music.step%s.lead.length;if(!muted){const n=s.lead[i];if(n)note(n,st*0.85,s.wave,0.045,music.next);if(i%2===0){const b=s.bass[(i/2)%s.bass.length];if(b)note(b,st*1.7,'triangle',0.11,music.next)}}music.step++;music.next+=st}}

/* ---------- save ---------- */
let save={level:0,best:0,crew:[],stars:[],gold:0,owned:[],equip:{hat:'hat_band',vest:'vest_brown',sword:'sw_cutlass'}};
try{const s=JSON.parse(localStorage.getItem('calicoCutlass')||'null');if(s)save=Object.assign(save,s)}catch(e){}
if(!Array.isArray(save.crew))save.crew=[];if(!Array.isArray(save.stars))save.stars=[];if(!Array.isArray(save.owned))save.owned=[];if(typeof save.gold!=='number')save.gold=0;if(!save.equip||typeof save.equip!=='object')save.equip={};save.equip=Object.assign({hat:'hat_band',vest:'vest_brown',sword:'sw_cutlass'},save.equip);if(!Array.isArray(save.scores))save.scores=[];if(typeof save.bonusLevel!=='number')save.bonusLevel=0;
function starsOf(i){return save.stars[i]|0}
function chartCount(){let n=0;for(let i=0;i<NCH;i++)if(starsOf(i)&1)n++;return n}
function starTotal(){let n=0;for(let i=0;i<NCH;i++){const s=starsOf(i);n+=(s&1)+((s>>1)&1)+((s>>2)&1)}return n}
function writeSave(){try{localStorage.setItem('calicoCutlass',JSON.stringify(save))}catch(e){}}

function plank(g,x,y,w,h,c){g.fillStyle=c;g.fillRect(x,y,w,h);g.fillStyle=shade(c,.28);g.fillRect(x,y,w,2);g.fillStyle=shade(c,-.4);g.fillRect(x,y+h-2,w,2);g.fillStyle='rgba(0,0,0,.3)';g.fillRect(x+w-1,y,1,h);g.fillStyle='#2a1a0a';g.fillRect(x+3,y+h/2-1,2,2);g.fillRect(x+w-6,y+h/2-1,2,2);g.strokeStyle='rgba(60,30,10,.35)';g.lineWidth=1;ln(g,x+7,y+h*.4,x+w-9,y+h*.4)}
function ladderTex(){return mk(T,T,g=>{g.strokeStyle='#5b3a1a';g.lineWidth=3;ln(g,7,0,7,T);ln(g,25,0,25,T);g.strokeStyle='#c99a5b';g.lineWidth=1;ln(g,6,0,6,T);ln(g,24,0,24,T);[8,24].forEach(y=>{g.fillStyle='#8a5a2b';g.fillRect(6,y-2,20,4);g.fillStyle='#b98244';g.fillRect(6,y-2,20,1)})})}
function spikeTex(c1,c2){return mk(T,T,g=>{for(let i=0;i<4;i++){const x=i*8;g.fillStyle=c1;tri(g,x,T,x+4,T-16,x+8,T);g.fillStyle=c2;tri(g,x+4,T-16,x+8,T,x+5,T)}})}
function crumbleFrom(plat){return mk(T,T,g=>{g.drawImage(plat,0,0,T,T);g.strokeStyle='rgba(30,10,0,.8)';g.lineWidth=1.2;g.beginPath();g.moveTo(8,0);g.lineTo(12,5);g.lineTo(9,10);g.moveTo(22,0);g.lineTo(19,6);g.lineTo(24,10);g.stroke()})}
function makeTiles(name){
  const R=mulberry(name.length*31+5);
  let top,fills=[],plat,spike,lad=ladderTex();
  if(name==='docks'){
    for(let v=0;v<3;v++)fills.push(mk(T,T,g=>{g.fillStyle='#24150a';g.fillRect(0,0,T,T);for(let i=0;i<2;i++){const x=i*16+1;const gr=g.createLinearGradient(x,0,x+14,0);gr.addColorStop(0,'#4f2e15');gr.addColorStop(.45,'#8f5d2f');gr.addColorStop(1,'#3d220d');g.fillStyle=gr;g.fillRect(x,0,14,T);g.strokeStyle='rgba(0,0,0,.28)';g.lineWidth=1;ln(g,x+4,2+v*3,x+4,12+v*3);ln(g,x+10,16-v,x+10,28-v)}if(v===1){g.fillStyle='#2b1a0d';g.fillRect(0,14,T,4);g.fillStyle='#6d7380';g.fillRect(3,15,2,2);g.fillRect(19,15,2,2)}}));
    top=mk(T,T,g=>{g.drawImage(fills[0],0,0,T,T);plank(g,0,0,T,13,'#a06a36');g.fillStyle='#1f1208';g.fillRect(0,13,T,2);g.strokeStyle='#d7b46a';g.lineWidth=2;g.beginPath();for(let x=0;x<=T;x+=8){g.moveTo(x,15);g.quadraticCurveTo(x+4,20,x+8,15)}g.stroke()});
    plat=mk(T,T,g=>{plank(g,0,2,T,10,'#a06a36');g.fillStyle='#4f2e15';g.fillRect(5,12,4,7);g.fillRect(23,12,4,7)});

function addPickup(type,x,y,phys){
  const p={type,x,y,w:20,h:20,t:0,phys:!!phys,vx:0,vy:0,life:phys?12:-1};
  if(type==='gem'){const g=[['#e23b4a',500],['#2fbf5a',750],['#3a7bea',1000],['#b54ae0',1500]][Math.floor(Math.random()*4)];p.col=g[0];p.value=g[1]}
  pickups.push(p);return p;
}
function spawnEnemy(type,tx,ty,extra){
  const m=1+lvl.idx*.1,md=1+lvl.idx*.08;
  const base={grunt:{w:26,h:46,hp:3,spd:55,dmg:12,score:300},rat:{w:24,h:36,hp:2,spd:100,dmg:8,score:200},musk:{w:26,h:46,hp:3,spd:0,dmg:10,score:400},fly:{w:28,h:20,hp:1,spd:90,dmg:8,score:250},jelly:{w:24,h:28,hp:2,spd:0,dmg:10,score:300},puffer:{w:26,h:24,hp:2,spd:55,dmg:10,score:350},crab:{w:30,h:22,hp:2,spd:45,dmg:10,score:350},parrot:{w:28,h:20,hp:1,spd:0,dmg:8,score:300},wcan:{w:32,h:28,hp:4,spd:0,dmg:12,score:500},shark:{w:28,h:28,hp:3,spd:0,dmg:12,score:400}}[type];
  const e=Object.assign({type,vx:0,vy:0,face:-1,t:Math.random()*9,state:'patrol',st:0,stun:0,frozen:0,flash:0,swing:-1,cd:1+Math.random(),aim:0,recoil:0,atk:0,dead:false,onGround:false},base);
  e.hp=Math.max(1,Math.ceil(base.hp*m*(EZ()?.7:1)));e.dmg=Math.round(base.dmg*md);
  e.x=tx*T+(T-e.w)/2;e.y=(ty+1)*T-e.h;e.home=e.x;e.hy=e.y;
  if(extra)Object.assign(e,extra);

/* ---------- tiles & physics ---------- */
function tileAt(tx,ty){if(ty<0||ty>=lvl.h)return 0;if(tx<0||tx>=lvl.w)return 1;return lvl.t[ty][tx]}
function isOneway(tx,ty){const c=tileAt(tx,ty);if(c===2)return true;if(c===5){const k=lvl.crumble.get(ty*lvl.w+tx);return !k||k.state!=='gone'}if(c===3)return tileAt(tx,ty-1)!==3;if(c===7)return true;return false}
function moveBody(b,dt,noOne){
  b.onGround=false;b.hitWall=0;
  b.x+=b.vx*dt;
  let top=Math.floor(b.y/T),bot=Math.floor((b.y+b.h-.01)/T);
  if(b.vx>0){const tx=Math.floor((b.x+b.w)/T);for(let ty=top;ty<=bot;ty++)if(tileAt(tx,ty)===1){b.x=tx*T-b.w-.01;b.hitWall=1;break}}
  else if(b.vx<0){const tx=Math.floor(b.x/T);for(let ty=top;ty<=bot;ty++)if(tileAt(tx,ty)===1){b.x=(tx+1)*T+.01;b.hitWall=-1;break}}
  if(b.hitWall)b.vx=0;
  const prevBottom=b.y+b.h;
  b.y+=b.vy*dt;
  const l=Math.floor(b.x/T),r=Math.floor((b.x+b.w-.01)/T);
  if(b.vy>0){const ty=Math.floor((b.y+b.h)/T);for(let tx=l;tx<=r;tx++){const c=tileAt(tx,ty);if(c===1||(!noOne&&isOneway(tx,ty)&&prevBottom<=ty*T+1.5)){b.y=ty*T-b.h;b.vy=0;b.onGround=true;b.gty=ty;b.groundTile=c;break}}}
  else if(b.vy<0){const ty=Math.floor(b.y/T);for(let tx=l;tx<=r;tx++)if(tileAt(tx,ty)===1){b.y=(ty+1)*T;b.vy=0;break}}
}
function solidPt(x,y){return tileAt(Math.floor(x/T),Math.floor(y/T))===1}

/* ---------- effects ---------- */
function part(o){parts.push(Object.assign({vx:0,vy:0,g:0,life:.6,max:.6,size:3,col:'#fff',type:'p',rot:0,vr:0},o));}
function burst(x,y,n,col,spd,opts){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=rand(spd*.3,spd);part(Object.assign({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.3,.7),col,size:rand(1.5,3.5),g:400},opts||{}))}}
function stars(x,y){for(let i=0;i<6;i++){const a=i/6*Math.PI*2;part({x,y,vx:Math.cos(a)*140,vy:Math.sin(a)*140,life:.4,max:.4,col:'#ffe58a',size:3,type:'star'})}}
function popup(x,y,txt,col){parts.push({type:'text',x,y,vx:0,vy:-50,g:0,life:1,max:1,txt,col:col||'#ffe58a'})}
function smoke(x,y,n,col){for(let i=0;i<n;i++)part({x:x+rand(-8,8),y:y+rand(-8,8),vx:rand(-40,40),vy:rand(-60,-10),life:rand(.5,1),max:1,col:col||'rgba(80,70,60,.5)',size:rand(6,12),type:'smoke'})}
function addScore(n,x,y){score+=n;lvlStats.treasure+=n;if(x!==undefined)popup(x,y,'+'+n);if(score>=nextLife){nextLife+=50000;if(lives<9){lives++;popup(P.x,P.y-20,'EXTRA LIFE','#7fff8a');SFX.power()}}}

/* ---------- combat ---------- */
function hurtPlayer(dmg,dir){
  if(!P||P.dead||P.invuln>0||state!=='play')return;
  if(P.mount){const m=P.mount;m.hp--;P.invuln=1;P.vx=(dir||-P.face)*160;P.vy=-220;SFX.hit();burst(P.x+P.w/2,P.y+P.h-10,8,'#ff8a5a',180);popup(P.x+P.w/2,P.y-10,m.hp>0?'CRAB HIT!':'CRAB RAN OFF!','#ffb08a');if(m.hp<=0)dismount(P,false);return}
  dmg=Math.max(1,Math.ceil(dmg*(EZ()?.5:1)));P.hp-=dmg;P.invuln=1.3;P.hurtT=.3;P.vx=(dir||-P.face)*220;P.vy=-280;P.climb=false;P.atk=0;if(P.rope){P.rope.held=false;P.rope=null}P.zip=null;P.pound=false;P.launched=false;
  if(P.carry){dropBarrel()}
  SFX.hurt();shake=Math.max(shake,6);burst(P.x+P.w/2,P.y+P.h/2,8,'#ffb0a0',200);

function updateEel(b,dt){

  b.trail=b.trail||[];b.trail.unshift({x:hx,y:hy});if(b.trail.length>90)b.trail.pop();
  if(b.state==='intro'){b.st-=dt;b.vx=0;b.vy=-40;if(b.st<=0){b.state='swim';b.st=2}}
  else if(b.state==='swim'){const tx=arena.x+400+Math.cos(b.t*.8)*250,ty=210+Math.sin(b.t*1.6)*110;b.vx+=((tx-hx)*2.2-b.vx)*dt*2;b.vy+=((ty-hy)*2.2-b.vy)*dt*2;b.face=b.vx>0?1:-1;b.st-=dt*enr;
    if(b.st<=0){const pt=b.patterns[Math.floor(Math.random()*b.patterns.length)];if(pt==='lunge'){b.state='lwind';b.st=.65;b.face=Math.sign(pcx-hx)||1}else if(pt==='zap'){b.state='zap';b.st=.95}else{b.state='spit';b.st=.4;b.shots=EZ()?2:3}}}
  else if(b.state==='lwind'){b.vx*=.9;b.vy*=.9;b.face=Math.sign(pcx-hx)||b.face;b.st-=dt;if(b.st<=0){const a=Math.atan2(pcy-hy,pcx-hx);b.vx=Math.cos(a)*500*enr;b.vy=Math.sin(a)*500*enr;b.face=b.vx>0?1:-1;b.state='lunge';b.st=.8;SFX.throw()}}
  else if(b.state==='lunge'){b.st-=dt;if(b.st<=0){b.state='swim';b.st=rand(1.4,2.2)}}
  else if(b.state==='zap'){b.vx*=.92;b.vy*=.92;b.st-=dt;if(b.st<=0){parts.push({type:'ring',x:hx,y:hy,life:.35,max:.35,r:150});SFX.boom();shake=6;if(Math.hypot(pcx-hx,pcy-hy)<150)hurtPlayer(14,Math.sign(pcx-hx)||1);b.state='swim';b.st=rand(1.2,2)}}
  else if(b.state==='spit'){b.vx*=.9;b.vy*=.9;b.face=Math.sign(pcx-hx)||b.face;b.st-=dt;if(b.st<=0){if(b.shots>0){b.shots--;b.st=.35;const a=Math.atan2(pcy-hy,pcx-hx);eBul.push({kind:'bubble',x:hx+b.face*30,y:hy,vx:Math.cos(a)*210,vy:Math.sin(a)*210,dmg:10,life:4});tone(500,.1,'sine',.06,-200)}else{b.state='swim';b.st=rand(1.2,2)}}}
  b.x+=b.vx*dt;b.y+=b.vy*dt;b.x=clamp(b.x,arena.x+60,arena.x+W-130);b.y=clamp(b.y,40,lvl.h*T-100);
  if(b.state!=='intro'&&!P.dead&&ov(b,P))hurtPlayer(b.cdmg,Math.sign(pcx-hx)||1);
}
function nextPattern(b){
  let opts=b.patterns.filter(p=>p!==b.last);const p=opts[Math.floor(Math.random()*opts.length)];b.last=p;
  const enr=b.hp<b.max/2;const pcx=P.x+P.w/2,bcx=b.x+b.w/2;b.face=Math.sign(pcx-bcx)||b.face;
  const fire=(n,spread)=>{const sx=bcx+b.face*b.w*.6,sy=b.y+b.h*.38;const base=Math.atan2((P.y+P.h/2)-sy,pcx-sx);for(let i=0;i<n;i++){const a=base+(i-(n-1)/2)*spread;eBul.push({kind:'ball',x:sx,y:sy,vx:Math.cos(a)*360,vy:Math.sin(a)*360,dmg:12,life:3})}SFX.shoot();smoke(sx,sy,5,'rgba(230,230,230,.6)');b.recoil=.2};
  const knife=()=>{const sx=bcx+b.face*20,sy=b.y+b.h*.4;const a=Math.atan2((P.y+P.h/2)-sy,(P.x+P.w/2)-sx);eBul.push({kind:'knife',x:sx,y:sy,vx:Math.cos(a)*430,vy:Math.sin(a)*430,dmg:10,life:3,rot:0});SFX.throw();b.atk=1};
  const lob=()=>{const sx=bcx,sy=b.y+10;const tx=P.x+P.w/2+rand(-90,90);const tt=1;eBul.push({kind:'bomb',x:sx,y:sy,vx:(tx-sx)/tt,vy:-GR*tt*.5,dmg:14,life:4,fuse:-1});SFX.throw()};
  b.at=0;
  switch(p){
    case 'spread':b.state='act';b.acts=enr?[[.5,()=>fire(3,.22)],[.9,()=>fire(4,.18)],[1.3,null]]:[[.55,()=>fire(3,.22)],[1.1,null]];b.aim=.5;break;
    case 'knives':b.state='act';b.acts=[[.35,knife],[.6,knife],[.85,knife]].concat(enr?[[1.1,knife],[1.4,null]]:[[1.15,null]]);break;
    case 'lob':b.state='act';b.acts=[[.4,lob],[.7,lob],[1,lob]].concat(enr?[[1.3,lob],[1.6,null]]:[[1.4,null]]);break;
    case 'summon':{const n=enemies.filter(e=>e.summoned&&!e.dead).length;if(n>=2){b.state='idle';b.st=.3;return}b.state='act';b.acts=[[.5,()=>{const ac=arena.x/T;spawnEnemy('rat',ac+1,10,{summoned:true,face:1,state:'chase'});spawnEnemy('rat',ac+22,10,{summoned:true,face:-1,state:'chase'});SFX.flag()}],[1,null]];break}
    case 'charge':b.state='wind';b.st=.6;break;
    case 'slam':case 'leap':{const target=p==='slam'?pcx:(arena.x+(bcx<arena.x+400?rand(520,700):rand(100,280)));const tt=.9;b.vx=(target-bcx)/tt;b.vy=-GR*tt*.5;b.state='air';b.slam=p==='slam';b.onGround=false;SFX.jump();break}
  }
}
function updateBoss(dt){
  const b=boss;b.t+=dt;b.flash-=dt;b.ifr-=dt;b.recoil-=dt;b.aim-=dt;if(b.atk>0)b.atk-=dt*3;
  if(b.dead){b.st-=dt;if(Math.random()<.2)burst(b.x+rand(0,b.w),b.y+rand(0,b.h),6,['#ffd25a','#ff7a1a'][Math.random()*2|0],160);b.vy=Math.min(b.vy+GR*dt,900);moveBody(b,dt);if(b.st<=0&&!b.dropped){b.dropped=true;const c=addPickup('chart',b.x+b.w/2-10,b.y,true);c.vy=-420;c.vx=0;c.life=-1;c.noOne=true;arena.done=true;smoke(b.x+b.w/2,b.y+b.h/2,16);SFX.fanfare();boss=null;banner={txt:'Chart piece!',t:2}}return}
  if(b.kind==='eel'){updateEel(b,dt);return}
  const enr=(b.hp<b.max/2?1.3:1)*(EZ()?.72:1);const pcx=P.x+P.w/2,bcx=b.x+b.w/2,dx=pcx-bcx;
  switch(b.state){
    case 'intro':b.vx=0;b.st-=dt;if(b.st<=0){b.state='idle';b.st=.8}break;
    case 'idle':b.face=Math.sign(dx)||b.face;b.vx=Math.abs(dx)>90?b.face*b.walk:0;b.st-=dt*enr;if(b.st<=0)nextPattern(b);break;
    case 'act':b.vx=0;b.face=Math.sign(dx)||b.face;b.at+=dt*enr;while(b.acts.length&&b.at>=b.acts[0][0]){const a=b.acts.shift();if(a[1])a[1]();else{b.state='idle';b.st=rand(.5,1)}}break;
    case 'wind':b.vx=0;b.st-=dt;b.face=Math.sign(dx)||b.face;if(Math.random()<.4)smoke(b.x+b.w/2-b.face*b.w/2,b.y+b.h,1,'rgba(200,180,150,.5)');if(b.st<=0){b.state='charge';b.st=2.2}break;
    case 'charge':b.vx=b.face*b.cspd*enr;b.st-=dt;if(Math.random()<.5)smoke(b.x+b.w/2-b.face*b.w/2,b.y+b.h,1,'rgba(200,180,150,.5)');if(b.hitWall||b.st<=0){b.state='stun';b.st=1.1;b.vx=0;if(b.hitWall){shake=12;SFX.boom();stars(b.x+b.w/2,b.y+10)}}break;
    case 'stun':b.vx=0;b.st-=dt;if(b.st<=0){b.state='idle';b.st=.4}break;
    case 'air':if(b.onGround){b.vx=0;if(b.slam){shake=12;SFX.boom();const gy=b.y+b.h;eBul.push({kind:'wave',x:b.x-10,y:gy-22,w:26,h:22,vx:-330,vy:0,dmg:12,life:1.6});eBul.push({kind:'wave',x:b.x+b.w-16,y:gy-22,w:26,h:22,vx:330,vy:0,dmg:12,life:1.6});smoke(bcx,gy,10,'rgba(200,180,150,.6)')}b.state='idle';b.st=.6}break;
  }
  b.vy=Math.min(b.vy+GR*dt,900);
  const wasAir=!b.onGround;
  moveBody(b,dt);
  if(b.x<arena.x+4){b.x=arena.x+4;if(b.vx<0)b.hitWall=-1;if(b.state==='air')b.vx=0}
  if(b.state!=='intro'&&b.state!=='stun'&&!P.dead&&ov(b,P))hurtPlayer(b.cdmg,Math.sign(dx)||1);
}

/* ---------- world update ---------- */
function updateWorld(dt){
  gt+=dt;lvlStats.time+=dt;
  for(const pl of plats){const ox=pl.x;if(pl.turtle){if(P&&P.ride===pl&&!P.dead){const inp=(keys.right?1:0)-(keys.left?1:0);pl.x=clamp(pl.x+inp*175*dt,pl.x0,pl.x1);if(inp)pl.face=inp}pl.dx=pl.x-ox;continue}if(pl.raft){if(!pl.started&&P.ride===pl)pl.started=true;if(pl.started&&pl.x<pl.x1)pl.x=Math.min(pl.x1,pl.x+pl.spd*dt);pl.dx=pl.x-ox;continue}if(pl.wait>0)pl.wait-=dt;else{pl.x+=pl.dir*pl.spd*dt;if(pl.x>pl.x1){pl.x=pl.x1;pl.dir=-1;pl.wait=.8}if(pl.x<pl.x0){pl.x=pl.x0;pl.dir=1;pl.wait=.8}}pl.dx=pl.x-ox}
  updatePlayer(dt);
  for(const [key,k] of lvl.crumble){if(k.state==='shake'){k.t-=dt;if(k.t<=0){k.state='gone';k.t=3.5;const tx=key%lvl.w,ty=(key/lvl.w)|0;for(let i=0;i<4;i++)part({type:'debris',x:tx*T+16,y:ty*T+6,vx:rand(-60,60),vy:rand(-80,0),g:1200,life:1,max:1,col:'#8a5a2b',size:rand(4,8),rot:Math.random()*6,vr:rand(-8,8)})}}else if(k.state==='gone'){k.t-=dt;if(k.t<=0){const tx=key%lvl.w,ty=(key/lvl.w)|0;if(!ov(P,{x:tx*T,y:ty*T,w:T,h:T}))k.state='solid';else k.t=.3}}}
  for(const e of enemies)if(!e.dead)updateEnemy(e,dt);
  enemies=enemies.filter(e=>!e.dead);
  // arena
  if(!arena.active&&!arena.done&&arena.bossSpawn&&P.x>arena.x+3*T&&!P.dead){arena.active=true;spawnBoss();SFX.flag()}
  if(boss)updateBoss(dt);
  // barrels
  for(const b of barrels){
    if(b.dead){if(b.arena&&arena.active){b.respawn-=dt;if(b.respawn<=0){b.dead=false;b.x=b.sx;b.y=b.sy-60;b.vx=b.vy=0;b.fuse=-1;b.thrown=false}}continue}
    if(b.carried){b.x=P.x+P.w/2-12;b.y=P.y-26;continue}
    if(b.fuse>=0){b.fuse-=dt;if(b.fuse<0){b.dead=true;b.respawn=7;explode(b.x+12,b.y+14,80,'barrel');continue}}
    b.vy=Math.min(b.vy+GR*dt,900);moveBody(b,dt);
    if(b.onGround)b.vx*=.8;
    if(b.thrown){
      let boom=b.onGround||b.hitWall;
      for(const e of enemies)if(!e.dead&&ov(b,e))boom=true;
      if(boss&&!boss.dead&&ov(b,boss))boom=true;
      if(boom){b.dead=true;b.respawn=7;explode(b.x+12,b.y+14,80,'thrown')}
    }
    if(b.y>lvl.h*T+80){b.dead=true;b.respawn=5}
  }
  // player bullets
  for(const u of pBul){
    if(u.g)u.vy+=u.g*dt;
    u.t+=dt;u.life-=dt;u.x+=u.vx*dt;u.y+=u.vy*dt;
    if(u.kind==='pbomb'){if(solidPt(u.x,u.y+6)||(boss&&!boss.dead&&ov({x:u.x-6,y:u.y-6,w:12,h:12},boss))||u.y>lvl.h*T){u.dead=true;explode(u.x,u.y,72,'thrown')}continue}
    if(u.kind==='fire'&&Math.random()<.7)part({x:u.x,y:u.y,vx:rand(-30,30),vy:rand(-60,-10),life:.35,max:.35,col:Math.random()<.5?'#ffd25a':'#ff7a1a',size:rand(2,4)});
    if(u.kind==='ice'&&Math.random()<.5)part({x:u.x,y:u.y,vx:rand(-20,20),vy:rand(-20,20),life:.3,max:.3,col:'#c9f6ff',size:2});
    if(solidPt(u.x,u.y)){u.dead=true;burst(u.x,u.y,5,u.kind==='bullet'?'#ffd25a':(MAGIC[u.kind]||{col:'#a0703a'}).col,120);continue}
    const ub={x:u.x-u.r,y:u.y-u.r,w:u.r*2,h:u.r*2};
    for(const e of enemies){if(!e.dead&&!u.hits.has(e)&&ov(ub,e)){u.hits.add(e);hurtEnemy(e,u.dmg,Math.sign(u.vx),140,{freeze:u.kind==='ice'&&e.type!=='crab',force:u.kind==='coco'});if(u.kind==='fire')burst(u.x,u.y,12,'#ff7a1a',200);if(u.kind!=='lightning'){u.dead=true;break}}}
    if(u.dead)continue;
    for(const c of crates)if(!c.dead&&ov(ub,c)){breakCrate(c);u.dead=true;break}
    if(u.dead)continue;
    for(const c of cages)if(!c.dead&&ov(ub,c)){hitCage(c);u.dead=true;break}
    if(u.dead)continue;
    for(const b of barrels)if(!b.dead&&!b.carried&&b.fuse<0&&ov(ub,b)){b.fuse=.05;u.dead=true;break}
    if(u.dead)continue;
    if(boss&&!boss.dead&&!u.hits.has(boss)&&ov(ub,boss)){u.hits.add(boss);hurtBoss(u.kind==='bullet'?1:u.dmg,'shot');if(u.kind!=='lightning')u.dead=true}
    if(u.life<=0)u.dead=true;
  }
  pBul=pBul.filter(u=>!u.dead);
  // enemy bullets
  for(const u of eBul){
    u.life-=dt;
    if(u.kind==='bomb'){u.vy=Math.min(u.vy+GR*dt,900);u.x+=u.vx*dt;u.y+=u.vy*dt;if(Math.random()<.5)part({x:u.x,y:u.y-8,vy:-40,life:.2,max:.2,col:'#ffd25a',size:2});if(u.fuse<0&&(solidPt(u.x,u.y+8)||isOneway(Math.floor(u.x/T),Math.floor((u.y+8)/T))&&u.vy>0)){u.fuse=.45;u.vx=0;u.vy=0}if(u.fuse>=0){u.fuse-=dt;u.vy=0;u.vx=0;if(u.fuse<0){u.dead=true;explode(u.x,u.y,62,'enemy')}}if(u.y>lvl.h*T+60)u.dead=true;continue}
    if(u.kind==='coconut'){u.vy=Math.min(u.vy+GR*.9*dt,800);u.y+=u.vy*dt;u.rot+=dt*8;const tx=Math.floor(u.x/T),ty=Math.floor((u.y+6)/T);if(tileAt(tx,ty)===1||isOneway(tx,ty)){u.dead=true;for(let i=0;i<6;i++)part({type:'debris',x:u.x,y:u.y,vx:rand(-120,120),vy:rand(-200,-60),g:1200,life:.6,max:.6,col:i%2?'#6a4424':'#f4ecd8',size:rand(3,6),rot:0,vr:rand(-8,8)});continue}if(ov({x:u.x-6,y:u.y-6,w:12,h:12},P)){hurtPlayer(u.dmg,1);u.dead=true}if(u.life<=0||u.y>lvl.h*T)u.dead=true;continue}
    if(u.kind==='wave'){u.x+=u.vx*dt;if(Math.random()<.6)part({x:u.x+13,y:u.y+20,vx:rand(-30,30),vy:rand(-90,-30),life:.4,max:.4,col:'rgba(210,190,150,.7)',size:rand(4,7),type:'smoke'});if(ov(u,P))hurtPlayer(u.dmg,Math.sign(u.vx));if(solidPt(u.x+(u.vx>0?u.w:0),u.y+10)||u.life<=0)u.dead=true;continue}
    u.x+=u.vx*dt;u.y+=u.vy*dt;if(u.kind==='knife')u.rot=(u.rot||0)+dt*18;
    if(solidPt(u.x,u.y)){u.dead=true;burst(u.x,u.y,4,'#aaa',100);continue}
    {const rr2=u.big?7:4;if(ov({x:u.x-rr2,y:u.y-rr2,w:rr2*2,h:rr2*2},P)){hurtPlayer(u.dmg,Math.sign(u.vx)||1);u.dead=true}}
    if(u.life<=0)u.dead=true;
  }
  eBul=eBul.filter(u=>!u.dead);
  // pickups
  for(const p of pickups){
    p.t+=dt;
    if(p.phys){p.vy=Math.min(p.vy+GR*dt*.8,700);moveBody(p,dt,p.noOne);if(p.onGround)p.vx*=.85;if(p.life>0){p.life-=dt;if(p.life<=0)p.dead=true}}
    if(crewHas('pepper')&&(p.type==='coin'||p.type==='gem')&&!P.dead){const dx=(P.x+P.w/2)-(p.x+p.w/2),dy=(P.y+P.h/2)-(p.y+p.h/2),d=Math.hypot(dx,dy);if(d<150&&d>1){p.x+=dx/d*320*dt;p.y+=dy/d*320*dt;p.t=Math.max(p.t,.3)}}
    if(!P.dead&&ov(p,P)&&(!p.phys||p.t>.25))collect(p);
  }
  pickups=pickups.filter(p=>!p.dead&&p.y<lvl.h*T+60);
  for(const r of ropes)if(!r.held){const na=.32*Math.sin(gt*1.6+r.ph);r.w=(na-r.a)/Math.max(dt,1e-4);r.a=na}
  for(const c of cannons)c.cd-=dt;
  for(const ch of chases)if(ch.armed&&!P.dead&&P.x>ch.x+6*T&&P.x<ch.endX){ch.armed=false;boulder={src:ch,x:ch.x-20,y:12*T-40,r:40,vx:110,rot:0,endX:ch.endX};banner={txt:'RUN!',t:1.4};SFX.boom();shake=8}
  if(boulder){const b=boulder;b.vx=Math.min(EZ()?140:165,b.vx+80*dt);b.x+=b.vx*dt;b.rot+=b.vx/b.r*dt;shake=Math.max(shake,2);if(Math.random()<.5)smoke(b.x-b.r*.6,b.y+b.r-4,1,'rgba(200,180,150,.5)');
    const box={x:b.x-b.r+6,y:b.y-b.r+6,w:b.r*2-12,h:b.r*2-6};
    if(!P.dead&&ov(P,box)){hurtPlayer(30,1);P.vx=360}
    for(const e of enemies)if(!e.dead&&ov(e,box))killEnemy(e,1);
    for(const c of crates)if(!c.dead&&ov(c,box))breakCrate(c);
    for(const br of barrels)if(!br.dead&&!br.carried&&br.fuse<0&&ov(br,box))br.fuse=.05;
    if(b.x>=b.endX){for(let i=0;i<18;i++)part({type:'debris',x:b.x,y:b.y,vx:rand(-260,260),vy:rand(-500,-100),g:1300,life:1.2,max:1.2,col:i%2?'#7a6a5a':'#5a4a3a',size:rand(6,14),rot:Math.random()*6,vr:rand(-10,10)});smoke(b.x,b.y,14,'rgba(150,140,130,.6)');SFX.boom();shake=14;boulder=null}}
  for(const v of vents){const x=v.x-camX;if(x>-40&&x<W+40&&Math.random()<dt*7)parts.push({type:'bubble',x:v.x+rand(-8,8),y:v.y-6,vx:rand(-10,10),vy:rand(-90,-50),g:0,life:2.2,max:2.2,col:'#fff',size:rand(2,4.5)})}
  jTimer-=dt;if(jTimer<=0){jTimer=.4;for(const e of enemies){if(e.dead||e.hidden||e.x+e.w<camX||e.x>camX+W)continue;markJournal(e.type==='fly'?'fly_'+lvl.info.flyer:e.type)}}
  if(journalToast){journalToast.t-=dt;if(journalToast.t<=0)journalToast=null}
  // crew helpers
  skyeCd-=dt;
  for(const c of cages)c.shake=Math.max(0,c.shake-dt);

    case 'health':{const hv=crewHas('biscuit')?50:25;if(P.hp>=P.maxHp)addScore(250,x,y);P.hp=Math.min(P.maxHp,P.hp+hv);popup(x,y-14,'+'+hv+' HP','#9effa8');}SFX.power();break;

  g.fillStyle='rgba(8,4,0,.65)';g.fillRect(0,0,W,H);panel(g,50,22,700,404);
  txt(g,'Paused',W/2,66,40,'#ffd94a','center',"'Pirata One',serif",6);

    g.fillStyle='rgba(255,255,255,.06)';rr(g,x-6,y-4,218,52,8);g.fill();

    g.textAlign='left';g.textBaseline='alphabetic';g.font="15px Bangers,Impact,sans-serif";g.fillStyle=got?'#ffd94a':'#999';g.fillText(got?c.name:'???',x+36,y+16,170);
    g.font="12px Bangers,Impact,sans-serif";g.fillStyle=got?'#ffe9c4':'#888';const pk=got?c.perk:(i<NCH?'Locked up in level '+(i+1):'Locked up in the Secret Isles');
    const words=pk.split(' ');let line='',ly=y+31;for(const w2 of words){const tl=line?line+' '+w2:w2;if(g.measureText(tl).width>172&&line){g.fillText(line,x+36,ly);line=w2;ly+=13}else line=tl}g.fillText(line,x+36,ly)});
  txt(g,'P to resume     Q to quit to map     M to mute',W/2,416,16,'#fff','center',null,2);
}
function render(){
  ctx.setTransform(K,0,0,K,0,0);ctx.imageSmoothingEnabled=true;
  if(state==='title'){drawTitle(ctx);return}
  if(state==='story'){drawStory(ctx);return}
  if(state==='map'){drawMap(ctx);if(banner)txt(ctx,banner.txt,W/2,250,30,'#ffd94a','center',null,4);return}
  if(state==='bmap'){drawBMap(ctx);return}
  if(state==='comic'){drawComic(ctx);return}
  if(state==='journal'){drawJournal(ctx);return}
  if(state==='shop'){drawShop(ctx);return}
  if(state==='diff'){drawDiff(ctx);return}
  if(state==='entry'){drawEntry(ctx);return}
  if(state==='scores'){drawScores(ctx);return}
  if(state==='battle'){drawBattle(ctx);return}
  if(state==='kraken'){drawKraken(ctx);return}
  drawWorld(ctx);if(lvl&&lvl.def.dark)drawDark(ctx);drawHUD(ctx);
  if(state==='intro'){const d=LEVELS[lvlIdx];drawOverlay(ctx,'Level '+(lvlIdx+1)+': '+d.name,[d.blurb,'Find the chart piece at the end of the level.',lvl.covers.length?'Secrets hidden here: '+lvl.covers.length+'. Look for sparkles!':''].concat(cages.length?['A crewmate is locked in a cage here. Break them out!']:[]),'Press Enter')}
  else if(state==='paused')drawPause(ctx);
  else if(state==='done')drawDone(ctx);
  else if(state==='gameover')drawOverlay(ctx,'Game Over',['The Brigade got you this time.','Score: '+score],'Enter: retry the level     Q: world map','#ff6a5a');
  else if(state==='win')drawOverlay(ctx,'The Compass Is Yours!',['All '+NUMW[NCH]+' pieces of the Tidewright Chart','lead Captain Calico to the Ninth-Tide Compass.','Final treasure: '+score,'Best: '+save.best],'Press Enter for the world map');
}

function newGame(){save.crew=[];save.stars=[];save.level=0;save.gold=0;save.owned=[];save.equip={hat:'hat_band',vest:'vest_brown',sword:'sw_cutlass'};writeSave();score=0;lives=9;nextLife=50000;mapSel=0;mapPos=0;state='story';SFX.click()}
function startLevel(i){lvlIdx=i;buildLevel(i);P.ammo=startAmmo();if(crewHas('whisker'))P.catnip=10;if(crewHas('marigold')&&lives<9)lives++;levelStartScore=score;lvlStats={treasure:0,kills:0,time:0,secrets:0,deaths:0};state='intro';introT=4;gt=0;banner=null;playSong(LEVELS[i].song)}
function update(dt){
  if(hit('mute')){muted=!muted;if(musicGain)musicGain.gain.value=muted?0:.32}
  titleT+=dt;
  switch(state){
    case 'title':startOverT-=dt;if(hit('scores')){state='scores';scoresNext=null;scoresHi=null;break}if(pressed.start||pressed.jump){pressed.start=pressed.jump=false;sessionId=Date.now();if(save.level>0||starTotal()>0){score=0;lives=9;nextLife=50000;goMap(save.level);mapPos=mapSel}else newGame()}else if(hit('cont')&&(save.level>0||starTotal()>0)){if(startOverT>0){startOverT=0;newGame()}else startOverT=3}if(!music.on&&AC)playSong(4);break;
    case 'story':if(hit('start')||hit('jump')||hit('attack')){state='diff';diffSel=0}break;
    case 'diff':{if(hit('up')||hit('left')){diffSel=0;SFX.click()}if(hit('down')||hit('right')){diffSel=1;SFX.click()}
      if(lastTap){const t=lastTap;lastTap=null;pressed.start=false;if(t.x>170&&t.x<630){if(t.y>150&&t.y<240)diffSel=0;else if(t.y>255&&t.y<345)diffSel=1;else break;save.easy=diffSel===0;writeSave();goMap(0);mapPos=0;break}}
      if(hit('start')||hit('jump')||hit('attack')){save.easy=diffSel===0;writeSave();SFX.power();goMap(0);mapPos=0}break}
    case 'shop':updateShop(dt);break;
    case 'comic':updateComic(dt);break;
    case 'journal':updateJournal();break;
    case 'bmap':{
      if(!bvoyage&&Math.abs(bPos-bSel)>.5)bvoyage={from:Math.round(bPos),rolled:false};
      if(bPos<bSel)bPos=Math.min(bSel,bPos+dt*2.5);else if(bPos>bSel)bPos=Math.max(bSel,bPos-dt*2.5);
      if(bvoyage&&!bvoyage.rolled&&Math.abs(bPos-bvoyage.from)>=.5){bvoyage.rolled=true;if(krakenRoll()){const v=bvoyage;bvoyage=null;startKraken('bonus',v.from,bSel);break}}
      if(bvoyage&&Math.abs(bPos-bSel)<.01)bvoyage=null;
      if(lastTap){const t=lastTap;lastTap=null;pressed.start=false;for(let i=0;i<NB;i++){const[x,y]=BMAPN[i];if(Math.hypot(t.x-x,t.y-y)<46&&i<=save.bonusLevel){if(i===bSel&&Math.abs(bPos-bSel)<.05)storyStart(NCH+i);else{bSel=i;SFX.click()}}}}
      if(hit('right')||hit('up')){if(bSel<save.bonusLevel){bSel++;SFX.click()}}
      if(hit('left')||hit('down')){if(bSel>0){bSel--;SFX.click()}}
      if((hit('start')||hit('jump')||hit('attack'))&&Math.abs(bPos-bSel)<.05)storyStart(NCH+bSel);
      if(hit('pause')||hit('isles')){goMap()}
      if(banner){banner.t-=dt;if(banner.t<=0)banner=null}
      break}
    case 'map':{if(banner){banner.t-=dt;if(banner.t<=0)banner=null}
      if(!voyage&&Math.abs(mapPos-mapSel)>.5)voyage={from:Math.round(mapPos),rolled:false};
      if(mapPos<mapSel)mapPos=Math.min(mapSel,mapPos+dt*2.5);else if(mapPos>mapSel)mapPos=Math.max(mapSel,mapPos-dt*2.5);
      if(voyage&&!voyage.rolled&&Math.abs(mapPos-voyage.from)>=.5){voyage.rolled=true;if(krakenRoll()){const v=voyage;voyage=null;startKraken('main',v.from,mapSel);break}}
      if(voyage&&Math.abs(mapPos-mapSel)<.01)voyage=null;
      if(lastTap&&lastTap.x<105&&lastTap.y>350&&lastTap.y<450){lastTap=null;pressed.start=false;if(battleOpen())startBattle();break}
      if(lastTap&&lastTap.x>660&&lastTap.y>100&&lastTap.y<136){lastTap=null;pressed.start=false;save.easy=!save.easy;writeSave();SFX.click();break}
      if(lastTap&&lastTap.x>700&&lastTap.y>300&&lastTap.y<392){lastTap=null;pressed.start=false;state='shop';shopSel=0;shopMsg=null;SFX.click();break}
      if(lastTap){const t=lastTap;lastTap=null;pressed.start=false;for(let i=0;i<NCH;i++){const[x,y]=MAPN[i];if(Math.hypot(t.x-x,t.y-y)<44&&i<=save.level){if(i===mapSel&&Math.abs(mapPos-mapSel)<.05)storyStart(i);else{mapSel=i;SFX.click()}}}}
      if(hit('right')||hit('up')){if(mapSel<save.level){mapSel++;SFX.click()}}
      if(hit('left')||hit('down')){if(mapSel>0){mapSel--;SFX.click()}}
      if((hit('start')||hit('jump')||hit('attack'))&&Math.abs(mapPos-mapSel)<.05)storyStart(mapSel);
      if(hit('mode')){save.easy=!save.easy;writeSave();SFX.click()}
      if(hit('shop')){state='shop';shopSel=0;shopMsg=null;SFX.click()}
      if(hit('journal')){state='journal';SFX.click()}
      if(lastTap&&lastTap.x>712&&lastTap.x<775&&lastTap.y>262&&lastTap.y<330){lastTap=null;pressed.start=false;state='journal';SFX.click();break}
      if(hit('isles')){if(bonusOpen()){bPos=Math.min(bPos,save.bonusLevel);goBMap(bSel)}else{tone(160,.2,'square',.08);banner={txt:'Collect '+BONUS_STARS+' stars to unlock',t:1.5}}}
      if(lastTap&&lastTap.x<85&&lastTap.y>95&&lastTap.y<165){lastTap=null;pressed.start=false;if(bonusOpen())goBMap(bSel);break}
      if(hit('battle')){if(battleOpen())startBattle();else{tone(160,.2,'square',.08)}}
      if(hit('pause')){recordScore(()=>{state='title';titleT=0})}
      break}
    case 'intro':gt+=dt;introT-=dt;if(introT<=0||hit('start')||hit('jump'))state='play';break;
    case 'play':if(hit('pause')){state='paused';break}{const steps=dt>1/70?2:1;for(let i=0;i<steps;i++){updateWorld(dt/steps);if(state!=='play')break}}break;
    case 'paused':if(hit('pause')||hit('start'))state='play';else if(hit('quit')){save.best=Math.max(save.best,score);writeSave();goMapFor(lvlIdx)}break;
    case 'done':{doneT+=dt;for(let k=0;k<3;k++){const at=.4+k*.45;if(doneT>=at&&doneT-dt<at&&(lvlStats.stars>>k)&1)tone(880+k*220,.18,'triangle',.1)}if(doneT>1.6&&hit('start')){recordScore(()=>{if(lvl.def.bonus){const bi=lvlIdx-NCH;bPos=bi;goBMap(Math.min(save.bonusLevel,bi+1))}else if(lvlIdx===NCH-1&&lvlStats.firstClear){playComic(SCENES.end,()=>{state='win';save.best=Math.max(save.best,score);writeSave();playSong(4)})}else{mapPos=lvlIdx;goMap(Math.min(save.level,lvlIdx+1))}})}break}
    case 'gameover':if(hit('quit')){recordScore(()=>{lives=9;score=levelStartScore;goMapFor(lvlIdx)});break}if(hit('start')){recordScore(()=>{lives=9;score=levelStartScore;nextLife=Math.ceil((score+1)/50000)*50000;startLevel(lvlIdx)})}break;
    case 'win':if(hit('start')){mapPos=NCH-1;goMap(NCH-1)}break;
    case 'entry':updateEntry();break;
    case 'scores':if(hit('start')||hit('jump')||hit('attack')||hit('pause')||lastTap){lastTap=null;pressed.start=false;const n=scoresNext;scoresNext=null;scoresHi=null;if(n)n();else{state='title';titleT=0}}break;
    case 'battle':updateBattle(dt);break;
    case 'kraken':updateKraken(dt);break;
  }
  for(const k in pressed)pressed[k]=false;
}
let last=performance.now();
function frame(now){
  let dt=(now-last)/1000;last=now;dt=Math.min(dt,1/30);
  try{update(dt);render()}catch(err){console.error(err)}
  requestAnimationFrame(frame);
}
